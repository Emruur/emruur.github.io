  var PHONE_IN = 12;    // on a phone, px further into the vine it feeds
  var PHONE_CLEAR = 8;  // ...and px its body keeps clear of the word, at least
  var VINE_SAMPLE = 0.12;   // seconds between re-reads of the vine's grid
  var LIFT    = 10;     // px above the label's middle
  var TURN    = 25;     // px/s of horizontal drift before it bothers to turn
  var BOB_A   = 3.5, BOB_P = 1.1;   // vertical hover, px and seconds
  var SWAY_A  = 1.8, SWAY_P = 1.7;  // and a smaller horizontal one
  var NIB_A   = 2.5, NIB_P = 0.42;  // the nibble: a lunge at the vine, while fed
  var Z_FRONT = 20;     // over the vine (2) and the nav (10)
  var Z_BEHIND = 1;     // under the vine, over body's black. NOT -1 -- see CSS
  var TAU = Math.PI * 2;

  // -- the meal ----------------------------------------------------------
  //
  // One envelope drives both of the things that happen while the bee is
  // feeding: its own halo widens, and the vine lights under its nose. It is a
  // SWELL and not a flash. The nibble is already a 0.42s beat and the bee is
  // already lunging on it; putting the light on that beat too gives a strobe,
  // and at this scale a strobe reads as a fault in the page rather than as an
  // animal. So the light says "feeding" and the motion says "biting", and
  // nothing at all is allowed on the beat.
  //
  // Out is faster than in: settling to eat is a thing that takes a moment, and
  // leaving is a decision already made by the time the bee moves.
  var FEED_IN   = 0.40;   // seconds for the feeding light to come up, once parked
  var FEED_OUT  = 0.25;   // and to let go when it leaves
  var GLOW_ADD  = 4;      // px ADDED to every halo radius at full feed -- not a
                          // multiplier, and the difference is most of what the
                          // effect costs. A blur is paid for by radius, and the
                          // bee's outer stop is 21px on a layer that re-rasters
                          // every frame because the wings are flapping; scaling
                          // all three by 1.9 took that stop to 40 and roughly
                          // doubled the area being blurred, for the part of the
                          // halo you can least see. Adding a constant instead
                          // doubles the 4px CORE, which is the part that reads
                          // as the bee lighting up, and moves the outer haze by
                          // a fifth. Measured at a third of the cost, and it is
                          // arguably the better look: the glow tightens into
                          // the bee rather than smearing away from it.
  // The bloom is paid for in the same coin as the halo. Promoting cells into the
  // vine's top band puts them on the layer carrying a 38px blur, and the wider
  // the lit blob, the larger the region of that layer the compositor re-blurs --
  // thirty times a second, for as long as the bee is parked. So the radius is
  // the expensive number here, not the amplitude, and 32 buys back most of what
  // 40 cost while still covering the strand and both its edges.
  var BLOOM_R   = 32;     // px radius of the patch of vine that lights up
  var BLOOM_AMP = 1.45;   // and how much brighter its centre gets, as a fraction

  // Baked from a photograph by bake.py -- the same tool and the same pipeline
  // the vine goes through: crop, box-downsample onto the grid, quantise
  // luminance, delta-encode. What lands here is LUMINANCE, not characters, so
  // the black point, the tone curve and the ramp below stay live controls in
  // the page instead of being frozen into the payload:
  //
  //   python3 makebee2.py source/bee2   # cut out, flapped, mirrored to face right
  //   python3 bake.py --video source/bee2/b%03d.png --crop 400:400:2:0 \
  //                   --cols 12 --rows 12 --white 252 --fps 18 \
  //                   --var ASCII_BEE --out bee-frames.js
  //
  // Two things differ from the vine's bake. The source is a still, so the wing
  // cycle had to be made before baking -- see makebee2.py. And 11x11 is the
  // grid as DISPLAYED: there is no master to resample down from, because the
  // bee is always drawn at one size, where the vine is sized off the window and
  // needs the headroom that a master buys.
  //
  // The bee's size is CELLS x CELL and both halves are adjustable, which is
  // more rope than it sounds: the cell count is how much FIGURE there is to
  // draw with, and the cell size is how heavy the drawing reads against the
  // vine. Eight cells at the vine's own 4px was a 19px bee with no silhouette
  // left in it, and ten at 8px was 48px of bee whose waist had closed up into
  // one mass; twelve at 5px is 36.1px, which keeps the waist open and the two
  // wings apart while the dots stay close enough to the vine's to read as one
  // hand. Ten cells is about the floor -- below it the figure is a blob.
  //
  // --white is 252 where the brightest cell is actually 219, which is not a
  // mistake: normalising against the true maximum drives the yellow bands to
  // the top of the ramp, and at a 4px cell two adjacent solid ■ merge into a
  // bar that reads as a glyph rather than as a stripe. Holding the white point
  // above the subject keeps the ramp's last step out of play.
  //
  // A photograph was tried here first and could not be made to work. A furry
  // insect keeps its identity in texture, and texture is exactly what a grid
  // this coarse destroys -- it arrives as noise, at any tone curve, and was
  // still unreadable at 44x28. What survives is flat tone and silhouette, which
  // is what the illustration this is baked from is already made of.
  // Half the size control -- the other half is the bake's --cols/--rows above
  // -- and the half that decides what the bee is MADE of: at 5 against the
  // vine's 4 its dots are a quarter larger, enough to hold their own on top of
  // the vine without reading as a different material.
  // 12 x 0.602 x 5 = 36.1px.
  //
  // That is now the vine's own cell too, square and 3px: the bee is drawn on
  // square cells because twelve rows of bee on 1:2 ones would be twice as tall
  // as they are wide and there would be no waist, and the vine moved onto the
  // same shape later for the same reason -- see its CHAR_SIZE.
  var CHAR_SIZE = 5;    // px per cell -> a 12x12 sprite, 36.1px
  var FLOOR = 16;       // black point: cells dimmer than this vanish
  var GAMMA = 0.80;     // <1 lifts the midtones, which is where the wing lives
  var RAMP  = " ·.∙•○●■";   // the vine's ramp, unchanged

  // The vine's own five greys, copied from its BANDS -- the bee is lit by the
  // same light as the plant it is flying around, and stays as monochrome as it
  // is.
  //
  // The GLOW is not copied, though: it is scaled -- and like the vine's it is a
  // compositor filter rather than a text-shadow, for the reason given there. The vine's radii were chosen
  // against a 6px cell and this bee's cell is 3px, so lifting its 80px outer
  // bloom unchanged would wrap a 29px sprite in a halo three times its own
  // width and leave a smudge with a bee somewhere inside it. These are close to
  // half the vine's, which is the same bloom measured in CELLS.
  //
  // `upto` is the highest ramp index the band claims, so the bands have to be
  // in order and the last one has to reach the end of the ramp.
  var BANDS = [
    { upto: 1, color: "var(--ink-0)" },   // the haze: recedes
    { upto: 3, color: "var(--ink-1)" },   // the body in shadow
    { upto: 5, color: "var(--ink-2)", halo: [[2, "var(--ink-2)"]] },
    { upto: 6, color: "var(--ink-3)", halo: [[3, "var(--ink-3)"], [8, "var(--ink-3)"]] },
    { upto: 7, color: "var(--ink-4)", halo: [[4, "var(--bloom)"], [10, "var(--bloom)"], [21, "var(--bloom)"]] }
  ];

  // Radii rather than a finished string, because the halo is no longer a
  // constant: it widens while the bee is feeding. Scaling the RADII and leaving
  // the colours alone is what keeps that reading as the same bee lit harder --
  // brightening the colours instead would take the core past --ink-4, which is
  // the end of the ramp and has nowhere left to go.
  //
  // The colour does not warm, either. Red on this page means one thing: the
  // label lit() marks, which is answering at the same moment the bee settles.
  // Two reds a hundred pixels apart would be two announcements of one event.
  function haloFilter(halo, add) {
    var out = "";
    for (var h = 0; h < halo.length; h++)
      out += (h ? " " : "") + "drop-shadow(0 0 " +
             (halo[h][0] + add).toFixed(1) + "px " + halo[h][1] + ")";
    return out;
  }

  /* ---------------------------------------------------------------------- */

  var data = window.ASCII_BEE;
  var host = document.getElementById("bee-stack");
  // Needed in two places now: the aim is measured off the vine's own edge, and
  // the fade-in waits on its .ready -- so it is read once, here.
  var stack = document.getElementById("stack");
  var buttons = [].slice.call(document.querySelectorAll("#gaze button"));
  // No payload, no bee -- and the vine, being a separate script, carries on.
  if (!data || !host || !stack || buttons.length < 2) return;

  var FLAP = 1 / data.fps;        // seconds a frame is held

  // One <pre> per band, stacked exactly on top of each other, each holding only
  // the glyphs its band claims and a space everywhere else. Straight out of the
  // vine's playbook, and safe for the same reason: every layer is the same
  // monospace grid at the same size, so cell (i,j) lands on the same pixel in
  // all of them.
  var pres = BANDS.map(function (b, i) {
    var p = document.createElement("pre");
    p.style.color = b.color;
    // No will-change here, and it is the single most expensive line that was
    // on this page. will-change:filter asks Chrome to keep the halo as a LIVE
    // compositor operation -- a render surface re-blurred every time the layer
    // is drawn -- and this layer is drawn on every frame there is, because the
    // bee is moving on every frame there is. Six chained blurs times five
    // layers times 120Hz. Worse, the bee is flying over the vine, so its damage
    // drags the vine's three glowing surfaces into the redraw with it: measured
    // on a 120Hz display, a page with the bee taken off it spent 9ms a second
    // on the GPU and the same page with the bee back on spent 380, with the
    // vine repainting twice a second either way.
    //
    // Without it the halo is blurred into the bee's raster instead, once per
    // wing frame -- eighteen a second, on a 36px sprite -- and flying it around
    // is a translate of a finished texture. Same picture, GPU thread down 36%.
    // #bee-stack keeps its will-change:transform: that one is true, the
    // transform really does change every frame, and it is what buys the layer
    // this reasoning depends on.
    //
    // The vine's layers keep theirs, and the asymmetry is the point: those
    // stand still and are re-written thirty times a second, so a composited
    // filter re-run is cheaper for them than a re-raster would be. See BANDS.
    if (b.halo) { p.style.filter = haloFilter(b.halo, 0); }
    p.style.fontSize = CHAR_SIZE + "px";
    if (i) p.style.position = "absolute";
    host.appendChild(p);
    return p;
  });

  /* ---- decoder --------------------------------------------------------- */

  var B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  var V = new Uint8Array(128);
  for (var i = 0; i < B64.length; i++) V[B64.charCodeAt(i)] = i;

  var cells = data.cols * data.rows, total = data.deltas.length + 1;
  var cache = new Uint8Array(total * cells);
  (function decode() {
    var work = new Uint8Array(cells), f, j;
    for (j = 0; j < cells; j++) work[j] = V[data.key.charCodeAt(j)];
    cache.set(work, 0);
    for (f = 1; f < total; f++) {
      var str = data.deltas[f - 1], p = 0, idx = 0, len = str.length;
      while (p < len) {
        var shift = 0, gap = 0, c;
        do { c = V[str.charCodeAt(p++)]; gap |= (c & 31) << shift; shift += 5; } while (c & 32);
        idx += gap;
        work[idx] = V[str.charCodeAt(p++)];
      }
      cache.set(work, f * cells);
    }
  })();

  /* ---- tone curve, then every frame composed once ---------------------- */

  // level -> character, and level -> which layer draws it. Both fall out of the
  // same curve, so a cell is looked up once and the band comes for free.
  var maxLevel = data.levels - 1;
  var lut = new Array(data.levels), band = new Uint8Array(data.levels);

  (function buildLut() {
    var span = data.white - FLOOR, b;
    for (var lv = 0; lv <= maxLevel; lv++) {
      var v = (lv * 255 / maxLevel - FLOOR) / span;
      v = v < 0 ? 0 : v > 1 ? 1 : Math.pow(v, GAMMA);
      var ci = Math.round(v * (RAMP.length - 1));
      lut[lv] = RAMP.charAt(ci);
      for (b = 0; b < BANDS.length - 1 && ci > BANDS[b].upto; b++) {}
      band[lv] = b;
    }
  })();

  // Twelve frames x two directions x five layers, composed once at startup.
  // The payload is 160 cells, so this is nothing, and it buys a draw that is
  // five textContent assignments with no per-frame work at all.
  //
  // Facing left is the column order reversed -- the vine's FLIP, for the vine's
  // stated reason: mirroring the element with scaleX(-1) would mirror the
  // glyphs too and leave every bead drawn backwards.
  function composeFrame(f, flip) {
    var cols = data.cols, rows = data.rows, off = f * cells;
    var out = BANDS.map(function () { return []; }), i, j, L;
    for (i = 0; i < rows; i++) {
      for (j = 0; j < cols; j++) {
        var lv = cache[off + i * cols + (flip ? cols - 1 - j : j)];
        var g = lut[lv];
        for (L = 0; L < BANDS.length; L++) out[L].push(" ");
        if (g !== " ") out[band[lv]][out[0].length - 1] = g;
      }
      // no trailing newline on the last row -- it would add an extra line box
      if (i < rows - 1) for (L = 0; L < BANDS.length; L++) out[L].push("\n");
    }
    return out.map(function (a) { return a.join(""); });
  }
  var FRAMES = { right: [], left: [] };
  for (var k = 0; k < total; k++) {
    FRAMES.right.push(composeFrame(k, false));
    FRAMES.left.push(composeFrame(k, true));
  }

  /* ---- where the buttons are, and where the plant is -------------------- */

  var halfW = 0, halfH = 0;

  // #stack's box is a poor stand-in for the vine. The grid is a good deal wider
  // than the plant inside it -- a tapering strand that only fills the middle --
  // so a bee that hugs the BOX stops forty pixels short of anything and eats
  // black air. What it has to hug is the ink, so the ink is what gets measured: the
  // rendered glyphs, read straight off the vine's own <pre>s. That is as close
  // as this script comes to the vine, and it still touches none of its state --
  // no clock, no frame number, no variable; just the text that is on the screen.
  //
  // Only the rows the bee actually spans are scanned, and the two dimmest layers
  // are skipped: BANDS[0] is --ink-0, a hair off the background, and BANDS[1]
  // barely further, so their outlying cells are ones you cannot see and
  // therefore not ones worth flying to. The split is cached for a tenth of a second, which is also how
  // often the aim is re-taken while the bee is feeding.
  var vinePres = [].slice.call(document.querySelectorAll("#stack pre"));
  var vineGrid = null, vineAt = -1e9;

  // getBoundingClientRect is a question the layout engine cannot answer without
  // finishing whatever layout it is in the middle of -- and the vine hands it a
  // fresh eleven-thousand-character grid thirty times a second, so asking for a
  // box from inside the bee's rAF forces that entire grid to be laid out again,
  // synchronously, before the call returns. The bee asks eight times a second
  // while it is feeding.
  //
  // None of these boxes move between resizes. The nav is positioned off #stack
  // in percentages, and #stack's own box is now pinned by buildGrid rather than
  // grown by its text. So measure once, keep it, and let the resize handler be
  // the only thing allowed to forget. Height is the test rather than existence,
  // for the vine's reason: a box measured before the grid was built is
  // legitimately zero and has to be taken again.
  var stackRect = null, btnRects = [];
  function stackBox() {
    if (!stackRect || !stackRect.height) stackRect = stack.getBoundingClientRect();
    return stackRect;
  }
  function btnBox(i) {
    var r = btnRects[i];
    if (!r || !r.height) r = btnRects[i] = buttons[i].getBoundingClientRect();
    return r;
  }
  function forgetRects() { stackRect = null; btnRects = []; }

  // The rotation's route: the word below this one, or back to the top. Read
  // off the rects and not the source order, because on a phone the four are
  // stacked in a different order from the one they are written in, and a bee
  // stepping through the HTML zigzagged up and down the column. On desktop the
  // two orders are the same and so is the route.
  function byHeight() {
    return buttons.map(function (b, k) { return k; })
      .sort(function (a, b) { return btnBox(a).top - btnBox(b).top; });
  }
  function nextDown(i) {
    var order = byHeight();
    return order[(order.indexOf(i) + 1) % order.length];
  }

  function vineLines() {
    if (vineGrid && clock - vineAt < VINE_SAMPLE) return vineGrid;
    vineAt = clock;
    vineGrid = vinePres.slice(2).map(function (p) { return p.textContent.split("\n"); });
    return vineGrid;
  }

  // px of the plant's edge on the given side, at the height cy: the rows the bee
  // covers are each measured, and a quantile of them answers -- see below. null
  // when that band is empty (out past the tip of the vine, say), and the caller
  // falls back to the box edge.
  function inkEdge(cy, left) {
    var g = vineLines();
    if (!g.length || !g[0].length) return null;
    var r = stackBox();
    if (!r.width || !r.height) return null;
    // Off the grid's own stamp, not off the length of a rendered line: repaint()
    // strips the trailing spaces now, so lines are no longer all one width and
    // the text can no longer be asked how wide the grid is. Re-validated here
    // like everything else this script reads from outside itself.
    var rows = +stack.dataset.rows, cols = +stack.dataset.cols;
    if (!(rows > 0) || !(cols > 0)) return null;
    var ch = r.height / rows, cw = r.width / cols;
    // the rows the sprite covers, and every one of them counts: the quantile
    // below needs a population, and one row is not one
    var lo = Math.max(0, Math.floor((cy - halfH - r.top) / ch));
    var hi = Math.min(rows - 1, Math.ceil((cy + halfH - r.top) / ch));
    var per = [], best, line, i, k, L;
    for (i = lo; i <= hi; i++) {
      best = -1;
      for (L = 0; L < g.length; L++) {
        line = g[L][i];
        if (!line) continue;
        // Walk in from the side being measured and stop at the first glyph --
        // except that on the right there is nothing to walk. repaint() ends
        // every line on ink, so the last character IS the rightmost glyph and
        // the scan is a subtraction. (Which also means charAt can no longer be
        // asked past the end of a line, where it answers "" and would have been
        // read as ink.)
        if (left) {
          k = 0;
          while (k < line.length && line.charCodeAt(k) === 32) k++;
          if (k >= line.length) continue;
        } else {
          k = line.length - 1;
        }
        if (best < 0 || (left ? k < best : k > best)) best = k;
      }
      if (best >= 0) per.push(best);
    }
    if (!per.length) return null;
    // A QUANTILE of those rows, not the outermost of them. The vine's silhouette
    // is ragged and it sways, so at any height one strand can be flung fifty
    // pixels past the rest for a few frames; aiming at the extreme hands that
    // strand the whole aim, and the bee backs off the plant to respect a twig.
    // The median is steady but it is the edge of the MASS, and a bee parked
    // there is buried in beads and cannot be picked out at all. A quarter of the
    // way in is the fringe: past the outliers, still outside the thick of it.
    per.sort(function (a, b) { return a - b; });
    var q = Math.round((per.length - 1) * EAT_PCT);
    var col = left ? per[q] : per[per.length - 1 - q];
    return r.left + (left ? col * cw : (col + 1) * cw);
  }

  // Straight off the live DOM, never off the CSS percentages. Those are
  // relative to #stack, which is sized by the vine's own grid maths and changes
  // on every resize; the rect is the one number that is true whatever the grid
  // decided. Recomputed at the start of each leg, so the aim follows the nav
  // through a relayout without the bee knowing anything about the vine.
  //
  // The button says WHICH SIDE and HOW HIGH; the plant says how far in. The
  // height is taken off the label, so the bee still reads as belonging to that
  // word, but x is measured off the vine -- the bee is here to eat, and the
  // plant is the thing it has to be next to.
  var PHONE = window.matchMedia("(max-width: 600px)");
  function aimAt(i) {
    var r = btnBox(i);
    // the side of the VINE, not of the window: they are the same line while it
    // hangs centred, and on a phone it hangs from the right, where a long word
    // like PHOTOGRAPHY can straddle the window's middle and still be the vine's
    // left-hand word
    var sb = stackBox();
    var mid = (sb.left + sb.right) / 2;
    var left = (r.left + r.right) / 2 < mid;
    // On a phone every word is on the left, so that is the side it feeds
    // from. It used to be the far one -- the gap between the words and the
    // vine was the one strip they needed to read clearly, and there was black
    // past the outermost leaves to eat in instead -- but the phone's vine is
    // a window onto the plant now and runs off the right edge, so the far side
    // is off screen. The clamp below keeps it off the label whose height it is
    // borrowing.
    var y = (r.top + r.bottom) / 2 - LIFT;
    // INSIDE the label, in the gap it leaves between itself and the vine, nose
    // to the nearest strand at its own height. The sign comes from the rect, so
    // both columns fall out of one line; `face` is the pose the arrival holds --
    // always at the plant.
    var edge = inkEdge(y, left);
    if (edge === null) {
      var s = stackBox();
      edge = left ? s.left : s.right;
    }
    var x = left ? edge - halfW - EAT_GAP : edge + halfW + EAT_GAP;
    // On a phone the word and the vine are on the SAME side of the bee, so a
    // narrow gap would park it over the word's tail -- PHOTOGRAPHY reaches
    // nearly to the leaves. So there it feeds further IN, PHONE_IN px into the
    // fringe rather than nose-to-edge outside it, and whatever that leaves,
    // its body clears the label by PHONE_CLEAR: more than the hover's sideways
    // drift (SWAY_A), which with a 2px margin was enough to carry it back over
    // the last letters while it ate. Flying past may cross a word; feeding not.
    if (PHONE.matches && left)
      x = Math.max(x + PHONE_IN, r.right + halfW + PHONE_CLEAR);
    return {
      x: Math.max(halfW + 4, Math.min(window.innerWidth - halfW - 4, x)),
      y: Math.max(halfH + 4, Math.min(window.innerHeight - halfH - 4, y)),
      face: left ? "right" : "left"
    };
  }

  /* ---- state ------------------------------------------------------------ */

  var autoIndex = 0;      // where the unattended rotation is up to
  var hoverIndex = -1;    // the button under the pointer, if any, which wins
  var legIndex = -1;      // the target the current leg was aimed at
  var target = { x: 0, y: 0 };
  var x = 0, y = 0, vx = 0, vy = 0;
  var arrived = false, dwell = 0;
  var legFace = "right";  // the pose this leg parks in, which is at the plant
  var eatT = 0;           // seconds since it settled; drives the nibble, alone
  var reaimT = 0;         // and since the aim was last re-taken at the plant
  var facing = "right", frame = 0, flapT = 0, drawn = "";
  var last = 0, clock = 0;
  var feed = 0;           // 0..1, the swell: everything about the meal rides it
  var beeReady = false;   // the bee is on screen -- nothing lights before that
  var glowShown = -1;     // the halo width last written, quantised

  function active() { return hoverIndex >= 0 ? hoverIndex : autoIndex; }

  // The label the bee is feeding at, lit the way a pointer lights one. -1 for
  // none. The walk in index.html marks its list with this same attribute and for
  // the same reason: the travel is the gesture, the colour is the arrival, and
  // they are not allowed to overlap -- so the list goes plain the moment the bee
  // leaves and one word answers when it settles. :hover is a separate rule and
  // still answers on its own frame, which is what makes a pointer feel instant.
  function lit(i) {
    // Nothing is lit before the bee is visible. start() parks it on button 0 and
    // the vine then takes about four seconds to grow, so without this the first
    // word would sit red and underlined under an empty patch of screen and
    // the rotation would be a word or two along by the time the bee faded up.
    if (!beeReady) i = -1;
    for (var j = 0; j < buttons.length; j++)
      buttons[j].setAttribute("aria-current", j === i ? "true" : "false");
  }

  // A leg is only re-aimed when the destination actually changes, because this
  // is also where depth is decided -- once, from the direction of travel, and
  // then held for the whole crossing. Deciding it per frame instead would let
  // the bee change planes halfway through the vine, which reads as a glitch
  // rather than as depth.
  function retarget(force) {
    var i = active();
    if (i === legIndex && !force) return;
    legIndex = i;
    target = aimAt(i);
    legFace = target.face;
    var dx = target.x - x;
    if (Math.abs(dx) > 24) {
      host.style.zIndex = dx > 0 ? Z_FRONT : Z_BEHIND;
    }
    arrived = false;
    eatT = reaimT = 0;   // the meal is over; both clocks start again on arrival
    lit(-1);          // and the label it was feeding at lets go
  }

  /* ---- motion ----------------------------------------------------------- */

  // A critically damped spring, not a tween and not a plain exponential chase.
  // A tween has to be torn down and restarted when a hover interrupts it, and
  // the restart shows as a kink; an exponential chase is smooth but starts every
  // leg at full speed, so the bee leaves like it was flicked. The spring carries
  // its velocity across a change of target, so an interrupt mid-flight becomes a
  // bank and not a corner, and it accelerates out of a standstill on its own.
  function integrate(dt) {
    var ax = OMEGA * OMEGA * (target.x - x) - 2 * OMEGA * vx;
    var ay = OMEGA * OMEGA * (target.y - y) - 2 * OMEGA * vy;
    vx += ax * dt; vy += ay * dt;
    x += vx * dt;  y += vy * dt;
  }

  function step(dt) {
    retarget(false);
    integrate(dt);

    var dx = target.x - x, dy = target.y - y;
    var speed = Math.sqrt(vx * vx + vy * vy);
    if (!arrived && Math.sqrt(dx * dx + dy * dy) < ARRIVE && speed < CALM) {
      arrived = true;
      dwell = DWELL;
      eatT = 0;
      lit(legIndex);
    }
    if (arrived) {
      eatT += dt;
      // The vine goes on swaying while the bee eats, so the aim is re-taken at
      // the cadence the grid is re-read and the spring walks the difference. It
      // is the same measurement, not a second mechanism: the bee holds station
      // against a strand that is moving, which is what feeding looks like.
      reaimT += dt;
      if (reaimT >= VINE_SAMPLE) {
        reaimT = 0;
        var re = aimAt(legIndex);
        target.x = re.x; target.y = re.y;
      }
    }
    // The swell. Linear in and out rather than eased, because it is already
    // being watched through a fade -- the halo it drives widens as a blur and a
    // blur softens its own ends. An ease here would land as a hesitation.
    feed += ((arrived && beeReady) ? 1 / FEED_IN : -1 / FEED_OUT) * dt;
    feed = feed < 0 ? 0 : feed > 1 ? 1 : feed;

    // the dwell clock only runs unattended: while the pointer is on a button the
    // bee stays put, however long that is
    // ...and it does not run before the bee is on screen either: the rotation
    // is the bee's tour of the list, so its first step is timed from the bee's
    // first landing, not from page load.
    if (arrived && hoverIndex < 0 && beeReady) {
      dwell -= dt;
      if (dwell <= 0) { autoIndex = nextDown(autoIndex); retarget(false); }
    }

    // Turning off the spring's own velocity, which is already smooth, so no
    // extra filtering is needed -- just a deadband, or the bee would flicker
    // between facings on the sub-pixel drift of the hover bob.
    if (vx > TURN) facing = "right";
    else if (vx < -TURN) facing = "left";
    // ...and the arrival overrules it: parked, the bee faces the plant whatever
    // it was doing on the way in. The two never fight over it, because a bee at
    // a standstill is inside the deadband and the rule above has no opinion.
    if (arrived) facing = legFace;

    flapT += dt;
    while (flapT >= FLAP) { flapT -= FLAP; frame = (frame + 1) % total; }
  }

  /* ---- drawing ---------------------------------------------------------- */

  function draw() {
    var key = facing + frame;
    if (key !== drawn) {
      drawn = key;
      var f = FRAMES[facing][frame];
      for (var L = 0; L < pres.length; L++) pres[L].textContent = f[L];
    }
    // The bob is added here and never integrated into x/y, so the hover wobble
    // rides on the flight instead of fighting the spring for the same variable.
    // Two periods that do not divide into each other, for the reason the vine
    // uses two: a single sine settles into a beat the eye picks up in seconds.
    // The nibble rides here too, and is the only one of the three that is not a
    // plain sine: a raised cosine off eatT, which leaves 0 on the exact frame
    // the bee settles -- so there is no step into it -- and which only ever
    // lunges TOWARD the plant, never away from it. Hence eatT and not clock:
    // the free-running clock would be caught mid-swing at every arrival.
    var nib = arrived ? NIB_A * (0.5 - 0.5 * Math.cos(eatT * TAU / NIB_P)) : 0;
    var bx = x + SWAY_A * Math.sin(clock * TAU / SWAY_P) +
             (legFace === "right" ? nib : -nib);
    var by = y + BOB_A * Math.sin(clock * TAU / BOB_P);
    host.style.transform = "translate3d(" + (bx - halfW).toFixed(2) + "px," +
                                            (by - halfH).toFixed(2) + "px,0)";

    // The halo, quantised to thirteen steps. The swell is only moving for about
    // half a second at each end of a meal; between those it holds, and a
    // quantised value means the style is not written at all while it holds. Five
    // filter strings a frame for no change would be five compositor invalidations
    // a frame for no change.
    var q = Math.round(feed * 12);
    if (q !== glowShown) {
      glowShown = q;
      var add = GLOW_ADD * (q / 12);
      for (var B = 0; B < BANDS.length; B++)
        if (BANDS[B].halo) pres[B].style.filter = haloFilter(BANDS[B].halo, add);
    }

    // The nose, in viewport coordinates -- taken from bx and not from x, so it
    // carries the lunge and the hover with it. This is the bite: where the vine
    // lights.
    var nose = bx + (legFace === "right" ? halfW + EAT_GAP : -(halfW + EAT_GAP));

    // The one thing the bee ever says to the vine, and it says it by leaving a
    // plain object on the window rather than by calling anything. Nothing is
    // read back, no function is shared, and the vine re-validates every field
    // before it uses one -- so the isolation the two scripts were written with
    // survives: a bee that throws, stalls or writes rubbish here still cannot
    // stop the plant from growing. See readBite() in the other script.
    window.BEE_BITE = feed > 0
      ? { x: nose, y: by, r: BLOOM_R, amp: BLOOM_AMP * feed }
      : null;
  }

  function tick(now) {
    if (!last) last = now;
    // clamped so a tab returning from the background integrates one ordinary
    // frame rather than a minute's worth, which would fire the bee off-screen
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    clock += dt;
    step(dt);
    draw();
    requestAnimationFrame(tick);
  }

  /* ---- pointer ---------------------------------------------------------- */

  // The zone is the GROUP, not the button: one of these words has a menu under
  // it, and a pointer that has moved down into that menu has not left the word
  // -- it is reading what the word opened. The bee stays, the dwell clock stays
  // stopped, and the label stays lit, which is the whole of what makes the
  // dropdown feel like part of the word rather than a panel in front of it.
  //
  // over/out rather than enter/leave, because those do not bubble and the
  // things being moved onto here are the menu's own children. The relatedTarget
  // test is what turns a bubbling out into a real leave: moving from the word to
  // an item inside its menu fires one, and it is not one.
  buttons.forEach(function (b, i) {
    var zone = b.closest(".drop") || b;
    zone.addEventListener("mouseover", function () {
      if (hoverIndex === i) return;
      hoverIndex = i;
      retarget(false);          // breaks off whatever leg was in progress
    });
    zone.addEventListener("mouseout", function (e) {
      if (hoverIndex !== i) return;
      if (e.relatedTarget && zone.contains(e.relatedTarget)) return;   // still inside
      hoverIndex = -1;
      // Resume the rotation FROM HERE rather than from wherever it had got to,
      // and move on at once: the word the pointer just left has had its visit.
      // Staying for a fresh DWELL -- what this used to do -- kept the word red
      // for a second and a half after the pointer was gone, and a bee still on
      // its way there landed and lit it AFTER the pointer had left, so letting
      // go of a word looked like it had stuck.
      autoIndex = nextDown(i);
      retarget(false);
    });
  });

  window.addEventListener("resize", function () {
    halfW = host.offsetWidth / 2;
    halfH = host.offsetHeight / 2;
    forgetRects();              // every box on the page has just moved
    retarget(true);             // the nav has moved; re-read the rects
  });

  /* ---- start ------------------------------------------------------------ */

  function start() {
    // Monospace advance width varies by font, so measure it rather than assuming
    // 0.6em -- the vine measures it for the same reason. The vine then shapes
    // its cells to whatever its payload was baked at (square, as it happens);
    // a hand-drawn sprite wants SQUARE cells regardless, or six rows of bee would
    // be twice as tall as it is wide and there would be no room to draw a waist.
    var probe = document.createElement("canvas").getContext("2d");
    var style = getComputedStyle(pres[0]);
    probe.font = style.fontWeight + " 100px " + style.fontFamily;
    var w = probe.measureText("MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM").width;
    var advance = w > 0 ? w / 40 / 100 : 0.6;
    pres.forEach(function (p) { p.style.lineHeight = advance + "em"; });

    // one draw to give the element a size before anything is measured against it
    var f0 = FRAMES.right[0];
    for (var L = 0; L < pres.length; L++) pres[L].textContent = f0[L];
    halfW = host.offsetWidth / 2;
    halfH = host.offsetHeight / 2;

    // PROJECTS first, on every layout -- it is the word with somewhere to go,
    // and the bee landing on it opens the list. The rotation then carries on
    // down the page from there (and wraps to the top) by nextDown.
    var home = buttons.indexOf(document.querySelector("#gaze .drop > button"));
    autoIndex = home >= 0 ? home : byHeight()[0];
    var first = aimAt(autoIndex);
    x = first.x; y = first.y;
    target = first;
    legFace = facing = first.face;
    legIndex = autoIndex;
    arrived = true;
    dwell = DWELL;
    // start() parks the bee at the first button without ever passing through
    // step(), so the label it is already feeding at has to be lit from here
    lit(autoIndex);
    host.style.zIndex = Z_FRONT;
    draw();

    // The bee comes in behind the last word, not behind the whole growth. The
    // nav fades itself in at the pace the vine descends past it and stamps #gaze
    // with `grown` on the last one, so that class is the cue: the list finishes
    // writing itself and the bee arrives to it, while the plant is still filling
    // out underneath. Waiting for the growth's full length instead left a few
    // seconds of finished list and nothing in it.
    //
    // Polled off the class rather than taken off an event, for the same reason
    // the vine's own `ready` is polled: this runs after fonts.ready and the nav
    // may well have finished first, and a class that is already set still reads
    // true where an event already fired is simply gone.
    //
    // The cap is a backstop on the whole opening, the nav's own included -- it
    // cannot be allowed to keep the bee off the page if it never marks itself.
    var gaze = document.getElementById("gaze");
    var plantData = window.ASCII_PLANT || window.ASCII_PLANT_PHONE;   // whichever bake loaded; both share an fps
    var CAP = (plantData ? (150 / plantData.fps) * 1000 : 4000) + 1200;
    var waitedFrom = performance.now();
    // Bumped by a replay, so a wait already in flight from the last opening
    // finds itself stale and stops, instead of fading the bee in early.
    var opening = 0;

    // On a replay the bee leaves with the list and comes back the way it first
    // arrived: faded out, nothing lit, and waiting on the same `grown` mark.
    // It keeps flying meanwhile; nobody can see it, and it is then already on
    // its rounds when it fades up.
    document.addEventListener("misket:replay", function () {
      opening++;
      host.classList.remove("ready");
      beeReady = false;
      lit(-1);
      waitedFrom = performance.now();
      waitForLabels(opening);
    });

    waitForLabels(opening);
    function waitForLabels(run) {
      if (run !== opening) return;
      if (!(gaze && gaze.classList.contains("grown")) &&
          performance.now() - waitedFrom < CAP)
        return void requestAnimationFrame(function () { waitForLabels(run); });

      // a beat behind the mark, so the bee's half-second fade sits under the tail
      // of the last word's rather than racing it
      setTimeout(function () {
        if (run !== opening) return;
        host.classList.add("ready");
        // Only now is there a bee to see, so only now is there anything to
        // light: the swell is held at zero until this, or the vine would come
        // out of its growth already blooming under an invisible bee.
        beeReady = true;
        forgetRects();      // the nav finished writing itself while we waited
        // The opening aim was taken before the vine had drawn a single frame, so
        // inkEdge() had nothing to measure and it fell back to the box. Now
        // there is ink: re-take it, and let the spring walk the bee the last
        // few pixels in while it fades up.
        retarget(true);
      }, 250);
    }

    requestAnimationFrame(tick);
  }

  // the same wait the vine makes, for the same face -- see the end of its script
  if (document.fonts && document.fonts.load)
    document.fonts.load('10px "MisketRamp"', " \u00b7.\u2219\u2022\u25cb\u25cf\u25a0M")
      .catch(function () {})
      .then(function () { return document.fonts.ready; })
      .then(start);
  else start();
})();
</script>
<script>
/* ---- the labels --------------------------------------------------------
   The nav comes in with the growth: once the vine has grown past the lowest
   word, the list rises into place from the bottom up, rather than sitting
   there complete while the plant is still a stub.

   Its own IIFE, and it reads the vine the way the bee does -- off the rendered
   <pre>s, never off the vine's clock or its frame number. The growth is a clip
   with a frame rate and the labels are four boxes with percentage tops, and the
   only thing that reliably relates them is where the ink actually IS. A
   schedule derived from the frame count would be a second copy of the timing,
   correct until the clip is re-baked or the window changes shape.

   The two dimmest bands are skipped for the reason the bee skips them: their
   outlying cells are ones you cannot see, and a word should not answer to a
   tip that has not visibly arrived. */
(function () {
  "use strict";

  var SAMPLE = 80;      // ms between reads; the growth is 24fps, this is plenty

  // The list waits for the growth to reach its LOWEST word and then rises:
  // bottom to top, STAGGER apart, answering the vine all at once rather than
  // following it down. Written in word by word as the tip passed each one, it
  // read as the growth ticking things off a list. Which word is lowest is read
  // off the boxes, so it is WEBDESIGN on desktop and PROJECTS on a phone with
  // nothing here knowing which layout is in force.
  var STAGGER = 220;    // ms between words in the rising cascade
  var cascade = [];     // its pending timeouts; non-empty while it runs

  var stack = document.getElementById("stack");
  var layers = [].slice.call(document.querySelectorAll("#stack pre")).slice(2);
  var pending = [].slice.call(document.querySelectorAll("#gaze button"));
  var rows = 0, at = -1e9;

  // Boxes, measured once. This loop runs through the growth, which is the one
  // stretch of the page where the vine is repainting a full grid every frame --
  // so a getBoundingClientRect in here does not read a box, it forces the whole
  // grid to be laid out again before it can answer. Nothing being measured
  // moves: #stack is pinned by buildGrid, the buttons are placed off it in
  // percentages, and a word being revealed only changes its opacity.
  var stackRect = null, btnRects = [];
  function stackBox() {
    if (!stackRect || !stackRect.height) stackRect = stack.getBoundingClientRect();
    return stackRect;
  }
  // Keyed off `all` and not off `pending`: pending is spliced as each word
  // reveals itself, so its indices move under you and a cache keyed on them
  // would start handing out the wrong box halfway through the growth.
  var all = pending.slice();
  function btnBox(b) {
    var i = all.indexOf(b), r = btnRects[i];
    if (!r || !r.height) r = btnRects[i] = b.getBoundingClientRect();
    return r;
  }

  // The nav marks itself done on the last word. That mark is the bee's cue --
  // it waits on this class, not on the growth's length -- so the list being
  // complete and the bee arriving are one event with one cause, and re-timing
  // the reveal re-times the entrance for free.
  var gaze = document.getElementById("gaze");
  function reveal(b) {
    b.classList.add("grown");
    var i = pending.indexOf(b);
    if (i >= 0) pending.splice(i, 1);
    if (!pending.length) gaze.classList.add("grown");
  }

  // The backstop. The vine's tip need not reach the lowest label -- the grid is
  // taller than the plant in it -- and with no payload at all there is no ink to
  // pass anything. Either way the list has to be there when the growth is over,
  // so the clip's own length decides the last word, whatever the ink did.
  var plant = window.ASCII_PLANT || window.ASCII_PLANT_PHONE;   // whichever bake loaded
  var backstop = 0;
  function armBackstop() {
    clearTimeout(backstop);
    backstop = setTimeout(function () {
      while (pending.length) reveal(pending[pending.length - 1]);
    }, (plant ? (150 / plant.fps) * 1000 : 4000) + 600);
  }
  armBackstop();

  // A replay takes every word back off the page and lets the regrowing vine
  // write them in again. The loop below stops itself once the list is done,
  // so it is started again here when it had. The sample clock is set to NOW
  // rather than cleared: at this instant the vine is still drawn fully grown,
  // and it repaints from black only on its next frame -- a read taken first
  // would see the old tip at the bottom and write every word straight back.
  // One SAMPLE of patience is several of the vine's frames.
  document.addEventListener("misket:replay", function () {
    var wasDone = !pending.length;
    cascade.forEach(clearTimeout);
    cascade = [];
    all.forEach(function (b) { b.classList.remove("grown"); });
    gaze.classList.remove("grown");
    pending = all.slice();
    at = performance.now();
    armBackstop();
    if (wasDone) requestAnimationFrame(tick);
  });

  // the grid is rebuilt on resize, so the row count is re-read rather than kept
  window.addEventListener("resize", function () {
    rows = 0; stackRect = null; btnRects = [];
  });

  // How far down the page the growth has got, in px: the lowest row that has any
  // ink in it, in the vine's own box. trimming the tail off the text is the
  // whole measurement -- rows below the tip are spaces and newlines and nothing
  // else, so what survives the trim ends on the last row that has something in
  // it, and counting its newlines is that row's index.
  // The lowest row with any ink in it, counted from the BACK of the text.
  //
  // This used to be a `.replace(/\s+$/, "")` and a `.split("\n")` per layer,
  // eight times a second, over eleven thousand characters that are mostly the
  // empty grid below the tip -- two full passes and two big allocations to find
  // one number, on the main thread, during the only part of this page that is
  // already painting a fresh grid every frame. Walking backwards over the tail
  // instead touches only the whitespace it is there to skip, allocates nothing,
  // and gets the row by subtraction: the grid has rows-1 newlines in it (the
  // last line carries none), so the newlines counted on the way back are the
  // rows BELOW the ink, and the rest are above it.
  function lastInkRow(t) {
    var i = t.length - 1, below = 0, c;
    while (i >= 0) {
      c = t.charCodeAt(i);
      if (c === 10) below++;
      else if (c !== 32 && c !== 9 && c !== 13) break;
      i--;
    }
    return i < 0 ? -1 : (rows - 1) - below;
  }

  function front() {
    if (!layers.length) return null;
    if (!rows) {
      // The grid's own stamp when it is there, and the newline count when it is
      // not -- the vine writes the stamp in buildGrid, which has run before this
      // loop starts, but a page with no payload never gets that far.
      rows = +stack.dataset.rows;
      if (!(rows > 0)) {
        var full = layers[0].textContent;
        if (!full) return null;
        rows = full.split("\n").length;
      }
    }
    var row = -1;
    for (var i = 0; i < layers.length; i++) {
      var n = lastInkRow(layers[i].textContent);
      if (n > row) row = n;
    }
    if (row < 0) return null;
    var r = stackBox();
    if (!r.height) return null;
    return r.top + (row + 1) * (r.height / rows);
  }

  function tick(now) {
    if (!pending.length) return;      // nothing left to wait for; stop the loop
    if (now - at >= SAMPLE) {
      at = now;
      var y = front();
      // lowest word first; nothing is revealed until the tip has passed it
      if (y !== null && !cascade.length) {
        var order = pending.slice().sort(function (a, b) {
          var ra = btnBox(a), rb = btnBox(b);
          return (rb.top + rb.height / 2) - (ra.top + ra.height / 2);
        });
        var low = btnBox(order[0]);
        // the middle of the word, not its top: the cascade should start as
        // the growth passes THROUGH it
        if (low.top + low.height / 2 <= y)
          cascade = order.map(function (b, k) {
            return setTimeout(function () { reveal(b); }, k * STAGGER);
          });
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>

<script>
/* ---- ash ----------------------------------------------------------------
   Once the nav has written itself in -- the same `grown` mark on #gaze the
   bee waits for, which lands while the vine is still finishing, rather than
   at the end of the clip -- the lit beads shed ash: one of the ramp's own small
   glyphs, off the grid now, pushed outward away from the vine. It cools as it
   goes, white to grey, and thins out into the dark about halfway to the edge
   of the window. Where the bee is eating, the vine sheds faster.

   Its own IIFE with its own clock. All it knows of the nav is that class, and
   all it knows of the vine is VINE_EMBERS,
   the one value the vine publishes after each repaint, and that is re-checked
   here every time: a missing or malformed one means no new ash, never an
   error. Nothing here is ever read back by anything else. */
(function () {
  "use strict";

  /* ---- everything adjustable, in one place ----------------------------- */

  // Sparse on purpose: an accent off the beads, not a second subject. And
  // STEADY: a fixed rate, spaced evenly by the debt counter in tick(), rather
  // than one that eases off as the air fills -- that version came in a rush
  // and then thinned to a trickle. Each speck fades out partway to the edge
  // (FADE), so the count holds at RATE times a lifetime of ten-odd seconds.
  var RATE      = 3.5;            // specks a second, always
  var CAP       = 140;            // hard ceiling, never reached in practice
  // ...and more where the bee is eating. The bite lifts the vine there into
  // its brightest bands already; this is the same patch burning faster, shed
  // from the lit cells inside it, so the ash comes off the bee's mouth and
  // nowhere it has not actually lit. Scaled by the bite's own swell, so it
  // rises and dies away with the meal rather than switching on and off.
  var BITE_RATE = 4;              // extra specks a second per unit of bite amp (~1.45 at full)
  var RAMP_IN   = 1.5;            // seconds for the shedding to come up once it starts
  var CORE_BIAS = 3;              // a core is this many times likelier to shed than a bead
  // A drift, not a throw. The push against the drag gives each speck a top
  // speed of PUSH / DRAG -- 20 to 53 px/s -- which it eases up to over a few
  // seconds and then holds all the way out.
  var SPEED     = [8, 18];        // px/s outward at release
  var PUSH      = [3, 8];         // px/s^2 outward thereafter: it speeds up as it goes
  // Bigger than the cell. At the vine's own size a speck is a two-pixel dot,
  // which is a bead when it sits among fifty others and nothing at all on its
  // own in the black.
  var GLYPH     = 2.2;            // speck size, in the vine's font sizes
  var COLD_HALO = 0.35;           // how much glow a fully cold speck keeps
  // The flicker, and the thing that makes it ash that is BURNING rather than
  // dust that is lit. Two sines at unrelated rates per speck, so no two pulse
  // together and none pulses in a rhythm; squared, so a speck idles dim and
  // flares briefly rather than breathing evenly. On a flare the halo swells
  // and the speck climbs one step back up HEAT -- it catches again for a
  // moment -- which is what a gentle alpha wobble could never say.
  // Tuned back from 0.85 / 0.7 / 0.7, where the specks all but went out
  // between flares and the field read as strobing rather than smouldering.
  var FLICKER   = 0.5;            // how far down a speck dims between flares, 0..1
  var FLARE_R   = 0.35;           // extra halo radius at the top of a flare, as a fraction
  var REKINDLE  = 0.8;            // pulse above which a speck shows one step hotter
  var HALO_MIN  = 0.45;           // the halo's floor between flares, as a fraction of its peak

  // The same flicker on the vine itself: every core cell -- the vine's
  // brightest band -- carries a halo on this canvas that flares and dims, so
  // the beads the ash comes off are visibly burning too.
  //
  // Here and not in the vine's own repaint, which could flicker the glyphs
  // themselves but only by rewriting the text, and so re-rastering and
  // re-blurring the glow layers, on EVERY frame -- giving up the skipped
  // repaints the page leans on to stay cool. This canvas is redrawn every frame
  // regardless; a hundred-odd sprites more is nothing to it.
  //
  // The pulse is a field over the SCREEN rather than a phase per cell. The
  // vine sways, so a bead is a different cell from one repaint to the next,
  // and a per-cell phase would make it jump between rhythms as it moved. Three
  // plane waves at unrelated angles and rates interfere into patches about a
  // bead across that flare and die irregularly, and a bead drifting with the
  // sway just carries on through the patch it is in.
  var BURN      = 0.35;           // a core's halo at the top of a flare, as globalAlpha (was 0.55)
  var BURN_R    = 1.1;            // its radius, in speck-halo radii (was 1.25)
  var BURN_SWELL = 0.3;           // extra radius at the top of a flare (was 0.45)
  var BURN_IN   = 1.2;            // seconds to come up, counted from the first speck shed
  var LIFT      = 2;              // px/s upward at release -- ash is warm
  var WOBBLE    = 8;              // px/s^2 of curl, so nothing travels in a line
  var DRAG      = 0.15;           // per second
  var COOL      = [2, 4];         // seconds from release to fully cold
  // Where a speck is gone, as a fraction of the way from where it left the
  // vine to the edge it is heading for. It starts fading at FADE_FROM of that
  // and is out at the end, so ash thins into the dark instead of being cut off
  // by the frame. Measured per speck against ITS edge, so a bead near the
  // window's side and one near the vine's axis both fade about halfway out.
  var FADE      = [0.4, 0.65];    // fully gone by here
  var FADE_FROM = 0.4;            // ...having started fading this far into that
  var MAX_LIFE  = 90;             // seconds; only a speck that never leaves sees it
  var MAX_HZ    = 60;             // this machine's Chrome asks for 120

  // Hottest to coldest, a glyph and an ink each. The same four steps down the
  // same ramp the vine is drawn in, so a speck leaving a bead reads as a piece
  // of it, and the inks are the vine's own bands -- no colour is named here.
  // The bottom of the ramp is left out: `.` and `·` are a pixel or two at any
  // size this is drawn at, so a speck cooling into them simply vanished
  // however large GLYPH was made. It cools in colour more than in shape.
  var HEAT = [
    { above: 0.80, glyph: "•", ink: "--ink-4" },
    { above: 0.60, glyph: "•", ink: "--ink-3" },
    { above: 0.35, glyph: "∙", ink: "--ink-3" },
    { above: -1,   glyph: "∙", ink: "--ink-2" }
  ];
  // Cold stops at --ink-2, not --ink-1: the vine's ink-1 is a stem, which is
  // read against the beads around it, and a lone speck that dim is invisible.

  /* ---------------------------------------------------------------------- */

  var canvas = document.getElementById("ash");
  var stack = document.getElementById("stack");
  var gaze = document.getElementById("gaze");
  if (!canvas || !canvas.getContext || !gaze) return;
  // The ash is pure motion, so with motion turned down there is none of it.
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ctx = canvas.getContext("2d");

  // Flat pools, one slot per speck and nothing allocated per frame.
  var x = new Float32Array(CAP), y = new Float32Array(CAP);
  var vx = new Float32Array(CAP), vy = new Float32Array(CAP);
  var ax = new Float32Array(CAP), age = new Float32Array(CAP);
  var heat0 = new Float32Array(CAP), cool = new Float32Array(CAP);
  var phase = new Float32Array(CAP), flick = new Float32Array(CAP);
  var x0 = new Float32Array(CAP), gone = new Float32Array(CAP);
  var alive = 0;

  var W = 0, H = 0, dpr = 1, glyphPx = 4, inks = [], halo = null, haloR = 0;
  var stackRect = null;

  function rand(r) { return r[0] + Math.random() * (r[1] - r[0]); }

  // The glow is a small sprite drawn under each speck, and NOT a drop-shadow
  // filter on the canvas the way the vine's bands do it. A filter is cheap for
  // the vine because its layers change thirty times a second at most and are
  // left alone in between; this canvas is the whole window and changes every
  // frame, so a filter on it would be the compositor re-blurring a window-sized
  // layer 60 times a second -- the exact cost this page has spent most of its
  // tuning getting rid of. A hundred 20px sprites is next to nothing.
  function buildHalo() {
    var probe = document.createElement("canvas").getContext("2d");
    probe.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--bloom").trim() || "#ccc";
    var hex = probe.fillStyle, rgb = "204,204,204";   // canvas hands back #rrggbb
    if (/^#[0-9a-f]{6}$/i.test(hex))
      rgb = [1, 3, 5].map(function (i) { return parseInt(hex.substr(i, 2), 16); }).join(",");
    haloR = Math.max(5, glyphPx * GLYPH * 1.4);
    var size = Math.ceil(haloR * 2 * dpr);
    halo = document.createElement("canvas");
    halo.width = halo.height = size;
    var h = halo.getContext("2d"), c = size / 2;
    var g = h.createRadialGradient(c, c, 0, c, c, c);
    g.addColorStop(0, "rgba(" + rgb + ",0.45)");
    g.addColorStop(0.35, "rgba(" + rgb + ",0.14)");
    g.addColorStop(1, "rgba(" + rgb + ",0)");
    h.fillStyle = g;
    h.fillRect(0, 0, size, size);
  }

  // Sized and styled off the vine itself, so this runs after the vine's own
  // resize handler (registered first, so it is called first) has rebuilt the
  // grid: the specks are the cell's size because they are its glyphs.
  function layout() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    var pre = stack && stack.querySelector("pre"), cs = pre && getComputedStyle(pre);
    glyphPx = (cs && parseFloat(cs.fontSize)) || 4;
    var root = getComputedStyle(document.documentElement);
    inks = HEAT.map(function (h) { return root.getPropertyValue(h.ink).trim() || "#888"; });
    // resizing the backing store resets the context, font and all
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = glyphPx * GLYPH + "px " + ((cs && cs.fontFamily) || "monospace");
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    buildHalo();
    stackRect = null;
    dirty = true;
  }

  // Cached for the same reason the vine caches it: the vine rewrites its text
  // thirty times a second, so a rect read at spawn time would force a layout
  // each time for a box that only ever changes on resize.
  function stackBox() {
    if (!stackRect || !stackRect.height) stackRect = stack.getBoundingClientRect();
    return stackRect;
  }

  // The vine's word, re-checked: null unless the nav is done and every field
  // is usable.
  //
  // Also where the ash's AXIS comes from: the median column of the lit cells,
  // not the middle of the vine's box. The beads do not sit centred in that box
  // -- most of the lit ones are left of its middle -- so splitting on the box
  // sent most of the ash left. The median puts half the beads either side by
  // definition, whatever shape the vine is in this frame. A count per column
  // and one walk up it, redone only when the vine has published a new frame.
  //
  // The same pass picks out the lit cells inside the bee's bite, if there is
  // one, into a list of their own for the extra shedding to draw from.
  var seen = null, view = null, hist = null, bitten = null, cores = null;
  function embers() {
    var e = window.VINE_EMBERS;
    if (!gaze.classList.contains("grown") || !e || !e.cells) return null;
    if (e === seen) return view;
    seen = e; view = null;
    var n = e.n | 0, cols = e.cols | 0, rows = e.rows | 0;
    if (n <= 0 || cols <= 0 || rows <= 0 || n > e.cells.length) return null;
    if (!hist || hist.length !== cols) hist = new Int32Array(cols);
    else hist.fill(0);
    if (!bitten || bitten.length < e.cells.length) {
      bitten = new Int32Array(e.cells.length);
      cores = new Int32Array(e.cells.length);
    }
    var b = e.bite, nb = 0, nc = 0, amp = 0;
    var bc = b && +b.col, br = b && +b.row, rc = b && +b.rc, rr = b && +b.rr;
    if (b && isFinite(bc) && isFinite(br) && rc > 0 && rr > 0 && +b.amp > 0) amp = +b.amp;
    for (var i = 0; i < n; i++) {
      var idx = e.cells[i] >> 1, row = (idx / cols) | 0, col = idx - row * cols;
      hist[col]++;
      if (e.cells[i] & 1) cores[nc++] = idx;
      if (amp) {
        var dc = (col + 0.5 - bc) / rc, dr = (row + 0.5 - br) / rr;
        if (dc * dc + dr * dr < 1) bitten[nb++] = e.cells[i];
      }
    }
    var axis = 0, run = 0;
    while (axis < cols - 1 && (run += hist[axis]) < n / 2) axis++;
    view = { cells: e.cells, n: n, cols: cols, rows: rows, axis: axis + 0.5,
             bitten: bitten, nb: nb, amp: nb ? amp : 0, cores: cores, nc: nc };
    return view;
  }

  function spawn(e, bit) {
    if (alive >= CAP) return;
    // Rejection sampling for the core bias: any lit cell, kept every time if
    // it is a core and one time in CORE_BIAS if it is not. Off the bite, from
    // the cells inside it.
    var list = bit ? e.bitten : e.cells, len = bit ? e.nb : e.n;
    if (!len) return;
    var code = -1;
    for (var tries = 0; tries < 8; tries++) {
      var c = list[(Math.random() * len) | 0];
      if ((c & 1) || Math.random() * CORE_BIAS < 1) { code = c; break; }
    }
    if (code < 0) return;
    var idx = code >> 1, row = (idx / e.cols) | 0, col = idx - row * e.cols;
    if (row >= e.rows) return;
    var r = stackBox();
    if (!r.width || !r.height) return;
    var cw = r.width / e.cols, ch = r.height / e.rows;
    var px = r.left + (col + Math.random()) * cw, py = r.top + (row + Math.random()) * ch;
    // Outward is away from the axis (see embers()). A bead on it has no side,
    // so it picks one.
    var mid = r.left + e.axis * cw, dir = px > mid ? 1 : -1;
    if (Math.abs(px - mid) < cw * 2) dir = Math.random() < 0.5 ? -1 : 1;
    var k = alive++;
    if (litAt < 0) litAt = clock;
    x[k] = px; y[k] = py;
    x0[k] = px;
    gone[k] = (dir > 0 ? W - px : px) * rand(FADE);
    vx[k] = dir * rand(SPEED);
    vy[k] = (Math.random() - 0.5) * 12 - LIFT;
    ax[k] = dir * rand(PUSH);
    age[k] = 0;
    heat0[k] = (code & 1) ? 1 : 0.68 + Math.random() * 0.1;
    cool[k] = rand(COOL);
    phase[k] = Math.random() * 6.283;
    flick[k] = 3 + Math.random() * 5;   // rad/s; the second rate is 2.3x this
  }

  // Swap the last live speck into the dead one's slot: order is meaningless,
  // so a death is O(1) and the live ones stay packed at the front.
  function kill(k) {
    var l = --alive;
    x[k] = x[l]; y[k] = y[l]; vx[k] = vx[l]; vy[k] = vy[l]; ax[k] = ax[l];
    age[k] = age[l]; heat0[k] = heat0[l]; cool[k] = cool[l];
    phase[k] = phase[l]; flick[k] = flick[l]; x0[k] = x0[l]; gone[k] = gone[l];
  }

  // How far a speck has got toward fading out: 0 until FADE_FROM of the way,
  // 1 at gone[]. Distance along its own direction of travel, which ax[] holds
  // the sign of; a wobble back toward the vine just counts as no progress.
  function fadeOf(k) {
    var d = (x[k] - x0[k]) * (ax[k] > 0 ? 1 : -1), g = gone[k];
    if (!(g > 0)) return 1;
    var u = (d / g - FADE_FROM) / (1 - FADE_FROM);
    return u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
  }

  // The cores' flicker -- see BURN. Off until the first speck has actually
  // left the vine (litAt, stamped in spawn), then up over BURN_IN, so the
  // vine catches as the first ash leaves it and not before.
  function burn(e, up) {
    var r = stackBox();
    if (!r.width || !r.height || !e.nc) return;
    var cw = r.width / e.cols, ch = r.height / e.rows, t = clock;
    for (var i = 0; i < e.nc; i++) {
      var idx = e.cores[i], row = (idx / e.cols) | 0, col = idx - row * e.cols;
      var cx = r.left + (col + 0.5) * cw, cy = r.top + (row + 0.5) * ch;
      var n = 0.5 + 0.2 * Math.sin(cx * 0.081 + cy * 0.047 + t * 3.7) +
                    0.17 * Math.sin(cx * -0.059 + cy * 0.093 + t * 5.9) +
                    0.13 * Math.sin(cx * 0.023 + cy * -0.071 + t * 8.3);
      var pulse = n * n;
      if (pulse < 0.04) continue;
      var rad = haloR * BURN_R * (1 + BURN_SWELL * pulse);
      ctx.globalAlpha = BURN * pulse * up;
      ctx.drawImage(halo, cx - rad, cy - rad, rad * 2, rad * 2);
    }
    ctx.globalAlpha = 1;
  }

  var last = 0, clock = 0, shedFor = 0, debt = 0, biteDebt = 0, dirty = false, running = false;
  var litAt = -1;                 // clock at the first speck of this shedding, or -1

  // The loop only exists while there is ash to move or a vine to shed it.
  // Once the last speck is off the screen and the vine is not shedding --
  // before the nav is in, and after a replay until it is in again -- tick()
  // stops asking for frames altogether, and the nav's `grown` mark wakes it.
  function wake() {
    if (running) return;
    if (!laid) { layout(); laid = true; }
    running = true; last = 0;
    requestAnimationFrame(tick);
  }

  function tick(now) {
    if (last && now - last < 1000 / MAX_HZ - 1) return void requestAnimationFrame(tick);
    // clamped, so a tab brought back after a minute does not fling the ash
    var dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
    last = now;
    clock += dt;

    var e = embers();
    shedFor = e ? shedFor + dt : 0;
    if (e) {
      var ramp = Math.min(1, shedFor / RAMP_IN);
      debt += RATE * ramp * dt;
      while (debt >= 1) { spawn(e, false); debt -= 1; }
      biteDebt += BITE_RATE * e.amp * ramp * dt;
      while (biteDebt >= 1) { spawn(e, true); biteDebt -= 1; }
    } else { debt = biteDebt = 0; litAt = -1; }

    if (!alive && !e) {
      // nothing in the air and nothing burning: clear once, and stop
      if (dirty) { ctx.clearRect(0, 0, W, H); dirty = false; }
      running = false;
      return;
    }
    requestAnimationFrame(tick);

    var drag = 1 - DRAG * dt, k, edge = haloR * (1 + FLARE_R);
    for (k = alive - 1; k >= 0; k--) {
      var p = phase[k];
      vx[k] = (vx[k] + (ax[k] + WOBBLE * Math.sin(y[k] * 0.013 + clock * 0.7 + p)) * dt) * drag;
      vy[k] = (vy[k] + WOBBLE * Math.cos(x[k] * 0.011 + clock * 0.5 + p * 1.3) * dt) * drag;
      x[k] += vx[k] * dt;
      y[k] += vy[k] * dt;
      age[k] += dt;
      // Gone the moment nothing of it can be seen -- faded out, or its halo
      // clear of the edge -- and not moved or drawn another frame after that.
      if (fadeOf(k) >= 1 || x[k] < -edge || x[k] > W + edge ||
          y[k] < -edge || y[k] > H + edge || age[k] > MAX_LIFE) kill(k);
    }

    ctx.clearRect(0, 0, W, H);
    dirty = true;
    if (e && litAt >= 0) burn(e, Math.min(1, (clock - litAt) / BURN_IN));
    for (k = 0; k < alive; k++) {
      var h = Math.max(0, heat0[k] * (1 - age[k] / cool[k])), s = 0;
      while (h <= HEAT[s].above) s++;
      var t = age[k] * flick[k] + phase[k];
      var n = 0.5 + 0.275 * Math.sin(t) + 0.225 * Math.sin(t * 2.3 + phase[k] * 2.7);
      var pulse = n * n;                                 // 0..1, mostly low
      if (pulse > REKINDLE && s > 0) s--;
      var fade = 1 - fadeOf(k);
      var a = (1 - FLICKER * (1 - pulse)) * fade;
      // the halo fades with the heat, down to a little, and swells with the
      // flare: between flares a cold speck is barely there, on one it is lit
      var r = haloR * (1 + FLARE_R * pulse);
      ctx.globalAlpha = Math.min(1, fade * (HALO_MIN + (1 - HALO_MIN) * pulse) *
        (Math.max(COLD_HALO, Math.min(1, h * 1.4)) + 0.5 * pulse));
      ctx.drawImage(halo, x[k] - r, y[k] - r, r * 2, r * 2);
      ctx.globalAlpha = a;
      ctx.fillStyle = inks[s];
      ctx.fillText(HEAT[s].glyph, x[k], y[k]);
    }
    ctx.globalAlpha = 1;
  }

  window.addEventListener("resize", function () { if (laid) layout(); });

  // Nothing runs until the nav is marked done -- by which time the vine has
  // long since sized its grid, which is what layout() reads -- and nothing
  // runs again after the ash is gone until it is marked again. An observer
  // and not a poll, so the wait costs nothing; the dropdown watches the same
  // class the same way.
  var laid = false;
  new MutationObserver(function () {
    if (gaze.classList.contains("grown")) wake();
  }).observe(gaze, { attributes: true, attributeFilter: ["class"] });
  if (gaze.classList.contains("grown")) wake();
})();
</script>

<script>
/* ---- replay -------------------------------------------------------------
   The name and CREATIVE PORTFOLIO play the opening again: the vine grows
   from black, the words write themselves back in as it passes them, and the
   bee returns after the last. Each script owns its own part and listens for
   this one event, so nothing here knows how any of them is built. */
(function () {
  "use strict";
  [].forEach.call(document.querySelectorAll("#corners .replay"), function (b) {
    b.addEventListener("click", function () {
      document.dispatchEvent(new Event("misket:replay"));
    });
  });
})();
</script>

<script>
/* ---- the dropdown -------------------------------------------------------
   Hover opens it, click pins it open, and the difference is the whole of the
   logic here. A pointer passing over a word should be able to see what is
   under it and then leave without having changed anything; a pointer that
   CLICKED the word has asked for the list to stay, and it then stays until it
   is dismissed -- another click, a click elsewhere, or Escape.

   It is not a CSS :hover, and the reason is that a click cannot close what
   :hover is holding open: the pointer is still on the word, so the rule that
   opened it is still matching, and the menu would snap back the moment the
   class came off. One state, in one place, driven by both inputs.

   The bee opens it too: while it is feeding at PROJECTS the list is out, and
   it rolls back up when the bee moves on. Three reasons to be open -- the
   pointer on the group, a click pin, the bee -- and the menu is open while any
   of them holds. The bee's is read off the aria-current the bee script stamps
   on the word it has landed at, so neither script reaches into the other.
   Dismissing (a click, a click elsewhere, Escape) clears all three, so a list
   shut while the bee is still there stays shut until it lands here again.

   The pointer's reason is mouse only, which is the point of pointerType: touch
   has no hover, and its first tap is the pin. On a mouse the pin ends when the
   pointer leaves -- see pointerout.

   pointerover/pointerout rather than enter/leave, because those bubble: the
   listener sits on the wrapper, which is pointer-events:none like the rest of
   #gaze, and only ever hears from the button and the items underneath it. The
   relatedTarget check is what turns a bubbling out into a real leave -- moving
   from the button to an item inside the menu fires one, and it is not one. */
(function () {
  "use strict";

  var drop = document.querySelector("#gaze .drop");
  if (!drop) return;
  var btn = drop.querySelector("button");
  var hover = false, pinned = false, bee = false;

  function sync() {
    var open = hover || pinned || bee;
    drop.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  function set(open) {
    if (open) hover = true;
    else hover = pinned = bee = false;
    sync();
  }

  // Closed until the growth has reached the word. The button is unhoverable
  // before then anyway -- pointer-events arrives with `grown` -- but the menu
  // must not be openable by a click that lands on the word's dark box either.
  function ready() { return btn.classList.contains("grown"); }

  drop.addEventListener("pointerover", function (e) {
    if (e.pointerType === "mouse" && ready()) set(true);
  });
  // A mouse leaving lets go of the pin as well as the hover. A click on a
  // mouse used to pin the list open past the pointer, which left PROJECTS lit
  // red over an empty patch of page until a click somewhere else -- reading
  // as stuck rather than as chosen. So on a mouse the pin lasts exactly as
  // long as the hover it was made under; it only outlives the pointer on
  // touch, where there is no pointer to outlive.
  drop.addEventListener("pointerout", function (e) {
    if (e.pointerType !== "mouse") return;
    if (e.relatedTarget && drop.contains(e.relatedTarget)) return;   // still inside
    hover = pinned = false;
    sync();                     // the bee may still be holding it open
  });

  new MutationObserver(function () {
    var landed = btn.getAttribute("aria-current") === "true";
    if (landed === bee) return;
    bee = landed && ready();
    sync();
  }).observe(btn, { attributes: true, attributeFilter: ["aria-current"] });

  btn.addEventListener("click", function (e) {
    e.preventDefault();
    if (!ready()) return;
    // Touch never hovered, so the first tap is the one that opens. On a mouse
    // the menu is already open by the time the click lands, and the click is
    // therefore either a pin or a dismissal.
    if (drop.classList.contains("open") && pinned) set(false);
    else { pinned = true; sync(); }
  });

  // A chosen item has answered the question the menu was asking.
  drop.addEventListener("click", function (e) {
    if (e.target.closest(".item")) set(false);
  });

  // pointerdown, not click: iOS Safari only fires click on things it thinks
  // are clickable, so a tap on the vine or the black never reached here and
  // the menu stayed open on a phone. pointerdown fires for every tap and press.
  document.addEventListener("pointerdown", function (e) {
    if (!drop.contains(e.target)) set(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && drop.classList.contains("open")) { set(false); btn.focus(); }
  });
  // a replay takes PROJECTS off the page, and its list must not outstay it
  document.addEventListener("misket:replay", function () { set(false); });
})();
</script>

<script>
/* ---- where the words go -------------------------------------------------
   The destination lives on the word, as data-href, and this is the one
   listener that honours it. PROJECTS has none and never will: it answers a
   click by unrolling its list, and the script above owns that.

   These stay <button>s and do not become <a>s, which looks like the obvious
   simplification and is not. `#gaze button` is the selector the bee's flight
   path and the growth's reveal are both built on -- four buttons, four rects
   read every frame, four words lit in turn -- and an <a> would drop out of
   both: the bee would stop visiting the word and the growth would never hand
   it `grown`, which is also what gives it pointer-events. So the anchor's one
   useful property is borrowed here instead, and the element stays what the
   rest of the page already believes it is.

   No guard on `grown` is needed: an ungrown button is pointer-events:none, so
   a click on it never reaches this listener at all. */
(function () {
  "use strict";

  document.getElementById("gaze").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-href]");
    if (btn) location.href = btn.dataset.href;
  });
})();
</script>

<!-- The type bench: index.html?fonts. Not part of the piece and never loaded
     without the flag -- see font-panel.js. -->
<script>
if (/[?&]fonts\b/.test(location.search)) {
  var fp = document.createElement("script");
  fp.src = "font-panel.js";
  document.body.appendChild(fp);
}
</script>
