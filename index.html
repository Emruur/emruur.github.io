<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Zoom is locked, and the reason is that this page cannot be panned: it is
     one fixed composition with overflow:hidden, so a pinch -- easily done by
     accident, on a phone or a trackpad over DevTools' device frame -- left it
     magnified from the top-left corner with no way to scroll to the rest: the
     words 1.3x and running off the bottom, the vine cut off at the right
     edge, CONTACT gone. The meta covers Chrome and Android; touch-action on
     html (below) covers iOS Safari, which ignores user-scalable. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Misket, in ASCII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* The whole palette, and the only place a colour is written down. Nothing
     below this block names one. Red is spent on exactly one thing, --accent:
     the label under the pointer, and the label the bee has landed on.
     Everything else is black, white or a step between.

     --ink-0..4 are the vine's five brightness bands and the bee's; --bloom is
     the colour of their glow. They are the sRGB relative luminance of the
     blue-cyan palette this page started from, so the five steps sit the same
     distance apart as they did (see BANDS) with the hue taken out.

     The page is black-background only, and that is a finding rather than an
     omission. A character grid on white is a drawing; this one is a picture of
     LIGHT, and everything here serves that -- five bands to get luminance
     range, a drop-shadow bloom cheap enough to run every frame, cores at
     --ink-4 with a 38px halo. On paper the bloom has no counterpart: a dark
     drop-shadow is a smudge, the glyphs stay discrete, and the grid stops
     dissolving and starts reading as text. A light theme was built twice, the
     second time on a whole separate bake of the plant re-lit against white,
     and the honest verdict was that it is a different artwork wearing this
     layout rather than a theme of this one. */
  :root {
    --bg:     #000;
    --text:   #ffffff;
    --accent: #ff3131;
    --ink-0:  #2d2d2d;
    --ink-1:  #565656;
    --ink-2:  #979797;
    --ink-3:  #d9d9d9;
    --ink-4:  #ffffff;
    --bloom:  #d4d4d4;
    /* --ui-font, --ui-weight and --ui-size are left UNSET on purpose: every
       rule that reads them carries its own fallback (JetBrains Mono, 400, 1x), so the
       page is exactly as written until something sets them -- which only
       font-panel.js does, and only when the URL asks for it with ?fonts. They
       reach the nav, its menu and the four corners; never the vine or the bee,
       whose font is a grid and not a typeface (see #stack pre). */
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);     /* the void: nothing behind the vine */
  }
  /* no pinch-zoom -- see the viewport meta. Taps are untouched. */
  html { touch-action: pan-x pan-y; }

  /* start, not center: the vine is attached at the top edge of its frame, and
     that edge is pinned to the top of the window so it grows DOWN into it */
  body { display: grid; place-items: start center; }

  /* One grid, drawn once per brightness band -- see BANDS in the script. The
     first layer is in flow and gives the stack its size; the rest sit exactly
     on top of it, which is safe because every layer is the same monospace grid
     at the same size, so cell (i,j) lands on the same pixel in all of them. */
  #stack { position: relative; opacity: 0; transition: opacity .6s ease; }
  #stack.ready { opacity: 1; }

  /* The browser's default monospace, not VT323, and the ramp is the reason.
     VT323 has no U+2219, U+25CB, U+25CF or U+25A0, so four of the eight ramp
     glyphs were being served by the fallback -- at that font's 0.602em advance
     inside a grid measured at VT323's 0.40em. Two things came of it, and
     neither looked like a font problem. Every line split into runs of two
     fonts, which is shaping work per line per layer per frame; and worse, a
     row's columns stopped agreeing between the layers, because a row is only a
     grid while every cell in it is one width. By column 70 the same cell sat
     19px apart across the five -- eight cell widths, so the bright beads were
     simply not on top of the haze they belong to.

     One font is therefore not a preference, it is what makes the stack work,
     and `monospace` is the one font guaranteed to be there. On macOS Chrome it
     resolves to Menlo, which covers the whole ramp at a single advance; if a
     machine ever turns up where the default does not, measure() says so in the
     console rather than letting it go quietly wrong. Note what NOT to name
     here: ui-monospace / SF Mono draws this ramp at three different widths.

     VT323 lost nothing by going -- the ramp is all dots and no letters. The
     nav kept it for its letterforms until it moved to JetBrains Mono; the grid
     never had any use for a typeface with character.

     Menlo is NAMED now rather than hoped for, and the face after it is carried
     in the page, because "the one font guaranteed to be there" turned out to be
     guaranteed only on a Mac. On Android `monospace` is Droid Sans Mono, which
     has no ∙ ○ ● or ■: four of the eight glyphs went to a fallback, the layers
     came apart exactly as described above, and the vine read as weak and fuzzy
     -- which looked like the glow having been switched off for the phone. It
     never was. MisketRamp is DejaVu Sans Mono, the font Menlo was drawn from,
     cut down to the ramp plus the "M" that measure() times: one advance
     (1233/2048, the same 0.602em), ~2KB inline, so it cannot fail to load. A
     Mac or an iPhone still draws Menlo and changes not at all. */
  @font-face {
    font-family: "MisketRamp";
    src: url(data:font/woff2;base64,d09GMgABAAAAAAgkAA4AAAAAGowAAAfSAAJZmQAAAAAAAAAAAAAAAAAAAAAAAAAAGhYbIBxCBlYAgXgRDAqCbIIwATYCJAMWCxYABCAFqw4HIBs/GaMQ2DgIGkwKxV8k2I6tsYInhaSjTp0DgTGDH2ffCElmCeDtpJ+3CnhyDjkZFT/YSu5oVdIiQ+5A2oKkiv3f1FV3/902lSbVQ+gBOwDuZFtJfAZ5LHlp3Sxlm2lywnfQsQJreV7lzu9/7lO/sk3ZLqQshGjnz86Ie+a8le2ZpuAwRX4/C9lsUZYtGYMoWa4toCUhK1SNLgvvqjekxufaUJgb2X/3Xuv+/bIMYQhDCCLilbdAQBUQCYKSIKCst77CwsUrNypKIA8IKJttrqzpYoPDVDQXc0811vRVCh1HBhM0t0MElbl7SF4P50hJJ6SXEvq+/uDG79or6khUyUpxMYmi5BhiWnMB1u61aA9ztdqvZp3/7xwuKxwYvkQAxIjRG2UcIRbQW2IHOmuKJVpGW+Xe1oABPdrXtF9sv5rnbH0b+effek++6tMvP/75g70/mPXBdMGHqJz9CKCg9S0PGJ1HWJXHuLcroTVgXlIG9JhHRvuaeRRovziPIu1XR1AJkaIoLwZl0BlFrMHJyDaCxYSXm+QFkZDUkmpSx0X2rkTlw2v77l87VBYdUj6MF8wPtf+x71ZOf9sxb5VPe2dTqVPxnxM2vW0rtrx74uZ39uUb/zxx92n5ps9P2BFHb3639njfjf133L/SPd+uhz/iPxrStx+UDmle3+nS5p2d+qoH9D1/x39efPZfR9x4w5FH3HTj4UfcfFN7mBtukK566umnFOPRE385/dDFhx1GC389Yzz4j5t1/TJ7bOytF2+59JJLtoy79TGfL72XXDqeWHrnP19QM5N6PkaYEy6Lz41/kOWSF5ODBUTbLr1r+ZmfbW/M/K3YrwheP6r+2a9H/Oe0/0L6SHEaioBA4cD/+5C8/pmQd5ZsJDnfzj6E722m3jAnMxnuoC2iqhH2rz0vAKkEFaeJhaSERyh50PJIHin6pB5v1pPrPNXdN3mmt//zogGhZ14xPczMa50Gh4M+5rp9Ol9hgQGx4qTyVhsFbrBuAnfNZvcA4wQ85ymhKoKSHngns0bgmSgC34GQ17eRCFLtEWe0sxC5gn5rgLVB2YoIgCoCvAwUjRF5FnBYgg1tYfhRCPO9fMIy9hxjwW+kEh7LwF2jex4UKVraGGB5YV+mCsjntVTx1GTidoV9NpJNm8oiAKrHPUcZUa+R6lnVV6qmBhfU+r9gkIgd3DQCnRTM8GV71ncMAvKq7JypnVGfYffP5fFgwLl5lYAmYNBIakM4FbYQ8SvWQpGKJFEMsDUYucNq5ZlShh5Li5GlxDy6ht4VcyJDrKSdS8kMjZm+2erIrG4BB22ipDuyzUVSLARDe9gB56kkmeS43mWl6NzkC86RlNLy0KUDV/cmoaDbIqlceDHN8QbpfjYOfrgo1CHtZKtiWvVPLyrmNBYxZY7PVHWjHVRGX22s76jMitGJ8QOPAANZD4We+lKTWs2mMheN3EhE3gM5EnjSxS62eqWb2LvFNHwA+KVRPJhXm2agr6+KVeZYct2g2dvfFw5SDjrZaE9ki2bZZ51s4b4HQX8gHdteIZbeJmm2OColJrfYR/ShuHjao7Zx76bIYPtKsx1IqqF6HJQZ056IsiPpmGHLIEh3A5wbxnU8gxJXEFc/WYChTmKZE4D061BR5NSIE3WxQF826uongMTEkwtPWHxYZKx1oEit1oX3LOS44JPs6RTrQpV6E2vqqwWAhFbPSnwVPdm2Ua+DtECWx8SoQtJBiTNhVR+as5bfao6+86SmFXKqSVklst1JAT/aNSr6TpRDElzrUfIp3dN2lhTEmyQx4OANDjJcNx3R3Vbto6KzN3aZkw5q+jht3CA6JXZNV2gcF9pjXpuTo2zLfV0U     font-display: block;
  }
  #stack pre {
    font-family: Menlo, "MisketRamp", monospace;
    font-weight: 400;
    font-variant-ligatures: none;
    white-space: pre;
    /* font-size, line-height and colour are all set by script */
    font-size: 4px;
    line-height: 1.2;
    text-rendering: optimizeSpeed;
    user-select: none;
    /* Lifted off the floor so the bee has a rung to sit UNDER. The obvious way
       to put the bee behind the vine -- z-index:-1 on the bee -- looks right and
       is not: `html, body` both carry background:#000, and while html's
       propagates to the canvas, BODY STILL PAINTS ITS OWN BLACK BOX. A block's
       background paints after negative stacking contexts, so a -1 bee is buried
       under it and simply never appears. So lift the vine instead of sinking the
       bee. #stack is position:relative with z-index:auto and therefore forms NO
       stacking context, which is what lets a body-level sibling interleave with
       these layers at all -- do not give #stack a z-index. */
    position: relative;
    z-index: 2;
    /* The box is buildGrid's to decide and never the text's. Every layer is
       given an explicit width and height there, and `size` containment is what
       makes those stick: with it, a line of text can no longer widen the <pre>
       it sits in. That is what lets repaint() strip the trailing spaces off
       every line -- more than half the characters on the page, and about 40%
       of the layout cost of re-shaping them -- without the five layers coming
       out five different widths and the vine sliding sideways as it grows.
       `layout` and `style` keep the rest of the invalidation inside the grid
       too, so a repaint can no longer make the nav re-lay-out its buttons. */
    contain: size layout style;
  }
  #stack pre + pre { position: absolute; top: 0; left: 0; }
  
  #gaze {
    position: absolute;
    inset: 0;
    pointer-events: none;
    /* Both scale with the window. The vine is sized off the HEIGHT, so on a
       phone it keeps most of its width and leaves each word ~90px of side to
       sit in: at a fixed 80px gutter every word landed off-screen. So the
       gutter runs from 80px at 1455 down through zero at ~877 and on into the
       vine, bottoming out at -60px by ~440 -- a word leaning into the outer
       leaves reads better than one shrunk to fit beside them. One line each
       rather than a breakpoint, so neither jumps as the window is dragged. */
    --gap: clamp(-60px, 13.85vw - 121.5px, 80px);
    --ls: .14em;
    /* the whole nav, shifted left of where the vine puts it */
    --nudge: 24px;
    /* ~27px at 430 (was ~22.6), still reaching 48px by ~1370 so desktop is
       unchanged. A line rather than a breakpoint, like --gap above. */
    font-size: calc(clamp(24px, 2.23vw + 17.4px, 48px) * var(--ui-size, 1));
    font-family: var(--ui-font, "JetBrains Mono"), monospace;
    font-weight: var(--ui-weight, 400);
    z-index: 10;
  }
  #gaze button {
    position: absolute;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    letter-spacing: var(--ls);
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--text);
    cursor: pointer;
    /* A label is not there until the growth has reached its height -- see the
       reveal script at the foot of the file. pointer-events goes with the
       opacity so an invisible word cannot be hovered into life early. */
    opacity: 0;
    pointer-events: none;
    transition: color .15s ease, text-shadow .15s ease, opacity .7s ease;
  }
  #gaze button.grown { opacity: 1; pointer-events: auto; }
  /* The label the bee has LANDED on -- lit() stamps this the moment it settles
     and clears it the moment it leaves, so the list sits white while the bee is
     crossing and one word answers while it is being fed at. Its own rule, ahead
     of :hover, so a pointer still wins and still holds through the travel. */
  #gaze button[aria-current="true"] { color: var(--accent); transition: none; }
  /* A pointer inside the open menu is still a pointer on the word: the list
     belongs to PROJECTS, so the word stays lit the whole time it is being read,
     and lets go only when the pointer leaves the group. `.open` is the group's
     hover, set by the script below -- see there for why this is not a :hover on
     the wrapper. The bee agrees with this: its own hover zone is the group. */
  /* Which side of the vine a word hangs on. A class and not the inline style
     it used to be, so the phone rule at the foot of the sheet can move a word
     across without !important; the height stays inline, one number per word. */
  #gaze .w { right: calc(100% + var(--gap) + var(--nudge)); }
  #gaze .e { left: calc(100% + var(--gap) - var(--nudge)); }
  /* ...and how far down it. Both heights live on the word itself, as custom
     properties, so each word's two placements are written side by side; the
     phone rule below only chooses which one is in force. */
  #gaze .w, #gaze .e { top: var(--top); }

  /* Every :hover on this page sits behind (hover: hover). A phone has no
     hover, but it fakes one: the element last tapped keeps :hover until the
     next tap lands somewhere else, so a tapped WebDesign or a tapped replay
     corner stayed red and underlined as if stuck. Touch gets its lit states
     from the things that really are state -- the open list, the bee's
     aria-current -- and a mouse gets those and hover both. */
  #gaze .drop.open > button {
    color: var(--accent);
    text-shadow: none;
    transition: none;
  }
  @media (hover: hover) {
    #gaze button:hover { color: var(--accent); text-shadow: none; transition: none; }
  }

  /* The underline under a lit label. A scaled pseudo-element rather than an
     animated width, so the whole sweep is one compositor-side transform and
     never re-lays out the nav -- which matters here because the bee is reading
     these buttons' rects every frame to aim at them.

     The direction is the point: it grows from the right edge leftward on the
     way in (transform-origin: right) and, on the way out, the origin flips to
     the left so it collapses leftward as well. Both halves of the gesture run
     the same way across the word, which reads as a wipe passing through rather
     than a bar that inflates and deflates in place. The out-origin lives on the
     resting rule, so it is already in force by the time the hover is lost.

     right is inset by the letter-spacing so the bar ends at the last letter
     instead of trailing into the gap after it.

     .42s, and three rules hold it: this bar, the corner bars, and the caret on
     PROJECTS. The curve is a hard ease-out, so most of the travel is spent in
     the first third and the number reads shorter than it is -- which is why a
     duration that looks long on paper still answers the pointer immediately.
     The caret is in the list because it is not decoration on a separate clock:
     on a mouse, hovering PROJECTS opens the menu, so the bar sweeps and the
     arrow turns off the same state change. Leave one at .28s and that word
     alone finishes in two stages. */
  #gaze button::after {
    content: "";
    position: absolute;
    left: 0;
    right: var(--ls);
    bottom: -.3em;
    height: .15em;
    /* the lit red, not currentColor: an unlit button is --text and fades back
       to it over .15s, which would bleach the bar mid-collapse */
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform .42s cubic-bezier(.22, 1, .36, 1);
    /* The bar is four pixels tall and it is the only thing on this page that
       has to move on the pointer's own frame, so it gets a layer of its own and
       keeps it. Without will-change the transition still runs on the
       compositor, but Chrome has to raster the bar into a NEW layer at the
       moment the sweep starts and throw that layer away at the end -- and the
       frame that raster lands on is, by definition, the first frame of the
       sweep, which is the one frame it is most visible to lose. Four permanent
       layers of 120x4px are nothing to hold; the promotion is everything to
       skip. */
    will-change: transform;
  }
  #gaze button[aria-current="true"]::after,
  #gaze .drop.open > button::after {
    transform: scaleX(1);
    transform-origin: right center;
  }
  @media (hover: hover) {
    #gaze button:hover::after { transform: scaleX(1); transform-origin: right center; }
  }

  /* ---- the one branching word ------------------------------------------
     The wrapper is the button's old inline placement and nothing else, so the
     button inside it lands on the same pixel it did as an absolute box. It is
     position:relative rather than static because the underline sweep above is
     absolutely positioned against the BUTTON, and the menu is positioned
     against the wrapper. */
  #gaze .drop { position: absolute; }
  #gaze .drop > button { position: relative; }

  /* A drawn arrowhead, not a glyph: VT323 has no U+25BE, so a character here
     would be served by the fallback at the fallback's advance -- the same
     mixed-font problem the vine has, with the mismatch landing right beside
     the word it belongs to. Borders have no font. currentColor ties it to the
     label, so it goes red with the pointer and with the bee. */
  #gaze .caret {
    display: inline-block;
    width: 0;
    height: 0;
    margin-left: .34em;
    vertical-align: .16em;
    border-left: .24em solid transparent;
    border-right: .24em solid transparent;
    border-top: .28em solid currentColor;
    transform-origin: 50% 35%;
    transition: transform .42s cubic-bezier(.22, 1, .36, 1);
  }
  #gaze .drop.open .caret { transform: rotate(180deg); }

  /* The padding is what bridges the gap under the word: with a margin there
     would be a strip between button and menu that belongs to neither, and a
     pointer crossing it would leave the group and shut what it was reaching
     for. Padding keeps the menu's hit box against the button's bottom edge and
     the first item still sits clear of the underline.

     visibility, not just opacity: a closed menu must be out of the tab order
     as well as out of sight, and it is what takes the items off the pointer
     too. It is transitioned with a 0s delay on the way in and the full
     duration on the way out, so the fade gets to finish before the box goes. */
  #gaze .menu {
    position: absolute;
    top: 100%;
    left: 0;
    padding: 1em 0 0;
    /* ~18px at 430, 26px from ~1130: a fifth down from where it was, once
       the nav went to a 0.6em mono and the items started reading as a second
       row of nav. Just over half the word it hangs from, so it reads as that
       word's list. */
    font-size: calc(clamp(17px, 1.07vw + 13.4px, 26px) * var(--ui-size, 1));
    line-height: 1.35;
    text-align: left;
    /* column + gap rather than margins on the items: one number for the space
       between them, and it holds whatever an item turns out to be */
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .7em;
    /* and the bridge has to be as wide as the word it leaves from: the list is
       shrink-to-fit and both items are narrower than PROJECTS, so without this
       a pointer coming down off the right half of the word would step off the
       side of the menu on the way to it */
    min-width: 100%;
    visibility: hidden;
    opacity: 0;
    transition: opacity .2s ease, visibility 0s linear .2s;
  }
  /* PROJECTS sits on the left of the vine, placed by its RIGHT edge, and on a
     phone that edge leans into the leaves. A menu pinned to it ended every item
     in the vine, which made the list hard to read. So the menu keeps the base
     rule's left edge and left alignment: the items start at the word's outer
     edge and, being shorter than PROJECTS, stop short of where it meets the
     vine. */
  #gaze .drop.open .menu {
    visibility: visible;
    opacity: 1;
    transition: opacity .2s ease, visibility 0s;
    /* The BOX takes the pointer, not just the items in it. #gaze is
       pointer-events:none and hands it back one element at a time, and with
       only the items handed it the padding above them was a strip of nothing:
       a pointer leaving the word to go down to the list passed through it, hit
       whatever was behind, and counted as having left the group -- so the menu
       shut in the gap and the items were never reachable. The padding is the
       bridge, and a bridge has to be solid. */
    pointer-events: auto;
  }

  #gaze .item {
    display: block;
    color: var(--ink-2);
    text-decoration: none;
    white-space: nowrap;
    pointer-events: none;      /* handed back only while the menu is open */
    opacity: 0;
    transform: translateY(-.28em);
    transition: color .15s ease, opacity .26s ease, transform .26s cubic-bezier(.22, 1, .36, 1);
  }
  #gaze .drop.open .item { opacity: 1; transform: none; pointer-events: auto; }
  /* the second item waits on the first, so the list unrolls rather than
     appearing -- the same thing the growth does to the nav, two items long */
  #gaze .drop.open .item:nth-child(2) { transition-delay: 0s, .07s, .07s; }
  /* White, not the red the nav uses. Red is the pointer's colour on the four
     words themselves and the bee's on the one it is eating; inside the list it
     would be a third thing saying the same word twice, and the list is already
     held red at its heading the whole time it is open. A step up the grey to
     --text is the same gesture at the volume this level is drawn at. */
  @media (hover: hover) { #gaze .item:hover { color: var(--text); } }

  /* The frame: four labels pinned to the corners of the WINDOW, against a nav
     that is pinned to the vine. They are not the nav and must not read as more
     of it -- the nav is the piece's own voice, white and 40px, and the growth
     decides when each word arrives -- so these sit small and a step down the
     same grey ramp the vine is drawn in (--ink-2, with the name one step up at
     --ink-3), and the red is left alone for the nav and the bee.

     fixed, not absolute: body is a grid and #corners is an item in it, so an
     absolute corner would be laid against the nearest positioned ancestor and
     an inset:0 one against the ICB -- workable, but it says "the viewport" by
     accident. The page is height:100%/overflow:hidden and never scrolls, so
     fixed IS the viewport and says so.

     The fade is the vine's own: #stack gets `ready` when the first frame is
     built, and the general sibling combinator carries it across to here, a
     quarter-second behind, with no second copy of the cue in script. */
  #corners {
    --pad: clamp(16px, 2.4vw, 30px);
    position: fixed;
    inset: 0;
    /* a frame is not a surface to click: only the two links take the pointer
       back, and nothing here may eat a hover meant for a button or the vine */
    pointer-events: none;
    z-index: 10;
    font-family: var(--ui-font, "JetBrains Mono"), monospace;
    font-weight: var(--ui-weight, 400);
    font-size: calc(clamp(14px, 2vw, 24px) * var(--ui-size, 1));
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-2);
    opacity: 0;
    transition: opacity .8s ease .25s;
  }
  #stack.ready ~ #corners { opacity: 1; }

  /* The padding is the corner's own, not the frame's, so the label is held off
     the window edge AND the link's hit area runs right out to it. */
  #corners .corner {
    position: absolute;
    padding: var(--pad);
    white-space: nowrap;
    color: inherit;
    text-decoration: none;
    /* two of the four are <button>s; this takes the UA chrome back off them.
       font is reset here, at this rule's weight, so .tl below still sets its
       own size over it */
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    background: none;
    border: 0;
  }
  #corners .tl { top: 0; left: 0; color: var(--ink-3); font-size: calc(clamp(13px, 1.9vw, 22px) * var(--ui-size, 1)); }
  /* the name and what the page is, both a fifth under the 2vw line the bottom
     pair is on: they label the page, they are not more ways out of it */
  #corners .tr { top: 0; right: 0; font-size: calc(clamp(12px, 1.6vw, 19px) * var(--ui-size, 1)); }
  /* One step up the grey from the word beside it, not white: the same --ink-3
     the name in the opposite corner sits at, so the two ends of the top edge
     weigh the same and neither competes with the nav. Emphasis by brightness,
     which is the only axis this page has. <em> for the emphasis it actually is,
     un-italicised: emphasis here is brightness, and only JetBrains Mono's upright
     is loaded, so an italic would be a slant the browser synthesises. */
  #corners .tr em { color: var(--ink-3); font-style: normal; }
  #corners .bl { bottom: 0; left: 0; }
  #corners .br { bottom: 0; right: 0; }

  /* The same wipe the nav has, at a quarter the weight: one gesture repeated
     small, so a corner answers the pointer the way a word does without
     pretending to be one. See #gaze button::after for why the origin flips.
     No will-change here -- these are two bars that move on a hover the pointer
     is already inside, not four that have to be right on the sweep's first
     frame, and a permanent layer each is not worth a corner. */
  #corners a.corner, #corners button.corner { pointer-events: auto; cursor: pointer; transition: color .15s ease; }
  @media (hover: hover) {
    #corners a.corner:hover, #corners button.corner:hover { color: var(--accent); }
  }
  /* CREATIVE is held a step brighter by its own colour; on hover the whole
     label answers, not just the half of it that inherits */
  @media (hover: hover) { #corners .tr:hover em { color: inherit; } }
  #corners a.corner::after, #corners button.corner::after {
    content: "";
    position: absolute;
    left: var(--pad);
    right: calc(var(--pad) + .14em);   /* stop at the last letter, not in the tracking after it */
    bottom: calc(var(--pad) - .22em);
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform .42s cubic-bezier(.22, 1, .36, 1);
  }
  @media (hover: hover) {
    #corners a.corner:hover::after,
    #corners button.corner:hover::after { transform: scaleX(1); transform-origin: right center; }
  }

  /* The bee. A body-level sibling of #stack, not a child of it, so its z-index
     competes with the vine's layers (2) and the nav (10) in the root stacking
     context: 20 puts it in front of the vine, 1 behind -- see the note on
     #stack pre for why 1 and not -1.

     Absolutely positioned against the initial containing block: body is
     position:static, and the page is overflow:hidden/height:100% and never
     scrolls, so ICB coordinates ARE viewport coordinates -- exactly what
     getBoundingClientRect() hands back, with no correction term. That is what
     makes anchoring to the buttons reliable under `place-items: start center`,
     where nothing else on the page has a predictable offset. */
  #bee-stack {
    position: absolute;
    top: 0;
    left: 0;
    /* never eat a hover meant for a button underneath */
    pointer-events: none;
    /* the vine's font, for the vine's reason -- same ramp, same missing glyphs,
       same five layers that only stack while every cell is one width */
    font-family: Menlo, "MisketRamp", monospace;
    font-weight: 400;
    font-variant-ligatures: none;
    white-space: pre;
    /* font-size and line-height are both set by script, from CHAR_SIZE and the
       measured advance, so the payload's 12x12 grid lands on square cells */
    text-rendering: optimizeSpeed;
    user-select: none;
    will-change: transform;
    opacity: 0;
    transition: opacity .5s ease;
  }
  #bee-stack.ready { opacity: 1; }

  /* The ash the grown vine sheds -- see the last script. Over the vine's
     layers (2) and under the nav and corners (10), so a speck drifting across
     a word goes behind it. The whole window and not the stack's box, because
     the point of the ash is that it leaves the vine and then the screen. */
  #ash {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity .6s ease;
  }
  #stack.ready ~ #ash { opacity: 1; }
  /* same disjoint-layer trick as the vine's colour bands */
  #bee-stack pre + pre { position: absolute; top: 0; left: 0; }

  /* Phone width: the vine hangs from the RIGHT edge and every word goes to
     its left. Split either side of a centred vine, each word had ~90px to
     itself and two of them leaned into the leaves; one column on the open
     side gives them the whole width the vine leaves, left-aligned in one
     column. Tighter tracking still buys PHOTOGRAPHY back a few characters. The frame loses its right-hand
     pair: the vine is standing where they were. */
  @media (max-width: 600px) {
    /* The vine here is its own bake, a strip of the footage drawn the full
       width of the window -- see fillGrid() in the vine's script, which sizes
       the box to it -- running off the right and bottom edges. Held to the
       right so that whatever the cell rounding leaves over falls on the black
       at the left. It used to be pushed 3px past the right edge and lifted
       20px past the top, to buy the fitted vine room beside the words and
       raise its body on the screen; the strip's framing does both now. */
    body { place-items: start end; }
    /* 6.7vw, topping out at 29px past ~430. Sized against PHOTOGRAPHY, the
       widest word, and the leaves nearest it across the whole sway: a 0.6em
       mono advance is half as wide again as VT323's 0.4em, and the 7.4vw that
       fitted VT323 ran PHOTOGRAPHY 24px into the vine at 360. It was 6vw while
       the words started 39px in; aligned to the corners at 16px, and with the
       phone's vine framed so its leaves stand further right, there is room
       for the words to be a step larger. */
    #gaze { --ls: .08em; font-size: calc(min(29px, 6.7vw) * var(--ui-size, 1)); }
    /* Placed against the WINDOW, not the vine. On desktop the words hang off
       the vine's sides and have to move with it; here they are a column of
       their own, so #gaze lets go of #stack and covers the viewport instead,
       and its left is the corners' own --pad, so the column of words starts on
       the same line as the name above it and CONTACT below, whatever the vine's
       grid decides its width is.
       The heights become fractions of the window rather than of the vine,
       which is 97% of it, so they barely move. Nothing between here and the
       root is transformed, so fixed really is the viewport. */
    #gaze { position: fixed; }
    /* --top-phone marks each word's MIDDLE, not its top edge (hence the
       translate), so four heights spaced evenly about 50% put the group's
       centre on the window's: 26.375 / 42.125 / 57.875 / 73.625, 15.75% apart --
       spread a touch from 15% so the Projects menu clears the word under it on a
       short phone. */
    #gaze .w, #gaze .e { right: auto; left: clamp(16px, 2.4vw, 30px);   /* #corners --pad */ top: var(--top-phone); transform: translateY(-50%); }
    #corners .br { display: none; }
    /* ...and the three that stay take some of the room it leaves: at the 2vw
       lines above they all sat on their 14/16px floors, small enough on a
       phone to read as a watermark. CONTACT keeps 18px; the name and
       PORTFOLIO under it sit a step below at 16 and 14, small enough to read
       as a caption to the page rather than a heading over it. */
    #corners .tl { font-size: calc(16px * var(--ui-size, 1)); }
    #corners .bl { font-size: calc(18px * var(--ui-size, 1)); }
    #corners .tr { font-size: calc(14px * var(--ui-size, 1)); }
    /* ...and PORTFOLIO leaves the top-right, where the vine now hangs, to sit
       under the name as its subtitle: same left inset, its box dropped by the
       name's line so the two read as a pair. 23px is the 16px name's line box,
       less the leading the smaller face carries above its capitals. */
    #corners .tr { left: 0; right: auto; top: 23px; }
    /* just PORTFOLIO here: in a two-line stack CREATIVE made it a second
       heading competing with the name. The space after it collapses at the
       start of the line once the word is gone. */
    #corners .tr em { display: none; }
    /* PROJECTS' list a step smaller than on desktop: on a phone it is
       directly under the column of nav, and at nav-adjacent size it read as
       two more nav words. */
    #gaze .menu { font-size: calc(15.5px * var(--ui-size, 1)); }
  }
</style>
</head>
<body>
<div id="stack" aria-label="Animated ASCII rendering of a hanging vine growing downward">
  <nav id="gaze" aria-label="Sections">
    <!-- no data-href while about.html is unfinished: the word stays, the
         click does nothing, the same as WebDesign -->
    <button type="button" class="w" style="--top: 20%; --top-phone: 26.375%;">About</button>
    <button type="button" class="e" data-href="photography.html" style="--top: 40%; --top-phone: 73.625%;">Photography</button>
    <!-- The one word that branches. The placement moves to a wrapper and the
         button goes static inside it, so the button's BOX is exactly where it
         was: the bee aims at these rects every frame and the reveal script
         measures them once, and neither may notice this happened. Everything
         under it is <a> and not <button> for the same reason -- `#gaze button`
         is the selector both of those scripts are built on, and a menu item
         that matched it would become a fifth thing the bee flies to and a
         fifth word the growth has to reach before the nav is done.

         The bee's route is HEIGHT order, read off the rects (nextDown in the
         bee script), so these can sit in any order and each word can carry a
         different height on a phone (--top-phone) without the bee zigzagging.
         Kept in desktop order anyway, so the source reads like the page. -->
    <div class="drop w" style="--top: 60%; --top-phone: 57.875%;">
      <button type="button" aria-expanded="false" aria-controls="projects-menu">Projects<i class="caret" aria-hidden="true"></i></button>
      <div class="menu" id="projects-menu">
        <a class="item" href="https://theoriginlibrary.com" target="_blank" rel="noopener">Origin Library</a>
        <a class="item" href="ImaginaryGarden/index.html">Imaginary Garden</a>
      </div>
    </div>
    <button type="button" class="e" style="--top: 80%; --top-phone: 42.125%;">WebDesign</button>
  </nav>
</div>

<!-- after #stack and a sibling of it, so `#stack.ready ~ #ash` can fade it in -->
<canvas id="ash" aria-hidden="true"></canvas>

<!-- The frame. Who the page is, what it is, and the two ways out of it, one
     to a window corner each. Deliberately not part of #gaze: the nav is the
     piece's own voice and the growth decides when it speaks, while these are
     chrome and are simply there once the vine is. Sibling of #stack and after
     it, which is what lets the fade below be a selector rather than a script. -->
<div id="corners">
  <!-- buttons, not links: they go nowhere, they play the opening again --
       see the replay script at the foot of the file -->
  <button type="button" class="corner tl replay">Emre Uğur</button>
  <button type="button" class="corner tr replay"><em>Creative</em> Portfolio</button>
  <!-- the two live ones: point them somewhere before this goes anywhere -->
  <a class="corner bl" href="#">Contact</a>
  <a class="corner br" href="#" target="_blank" rel="noopener">GitHub</a>
</div>

<!-- Baked like the vine, but flown in real time: the wing cycle is a payload,
     where it faces and where it goes are decided frame by frame. -->
<div id="bee-stack" aria-hidden="true"></div>

<!-- Two bakes of the one vine, and a page only ever needs one of them: the whole
     plant for a window it fits in, and on a phone its top-left quarter at twice
     the density, drawn twice the size -- see the phone note in the vine's
     buildGrid(). Written in rather than both listed, so a phone never fetches
     the megabyte it would not draw. Same breakpoint as the stylesheet's phone
     block; the vine's script fetches the other one if a window crosses it. -->
<script>
  document.write('<script src="' + (window.matchMedia && matchMedia("(max-width: 600px)").matches
    ? "plant-frames-phone.js" : "plant-frames.js") + '"><\/script>');
</script>
<script src="bee-frames.js"></script>
<script>
(function () {
  "use strict";

  /* ---- everything adjustable, in one place ----------------------------- */

  var SCALE     = 0.97;           // how much of the window height the vine fills
  // What this is ever about is the CELL, and a cell is advance x size: 5 in a
  // 0.602em font is a 3px cell, and the cell is SQUARE (see CELL below), so
  // that is a 3px row pitch as well. The vine was first drawn on 2.4 x 4.8px
  // cells -- the 1:2 every character grid starts from -- and that shape was
  // the single largest thing between this and the footage: twice as much
  // detail across as down, so every bead was sampled as a stack of three or
  // four horizontal rows with a dark gap between each, and read as a bar of
  // dashes rather than a round bead. Halving the row pitch put the beads back
  // round and the stems back continuous, and needed a master with twice the
  // rows to feed it. Below about 2px a lit bead is a dot small enough to read
  // as grey however bright its colour, which is why this does not go to 4.
  //
  // It is the RESOLUTION the vine asks for, though, not the size it ends up:
  // buildGrid turns it into a row count and then sizes the cell to fill the
  // window, so on a display tall enough to exhaust the master the cell grows
  // past this and the stems thicken. That is the trade a 400-row master makes.
  var CHAR_SIZE = 5;              // CSS pixels per character, before fitting
  // ...and on a phone, where the vine is drawn the full width of the window
  // (fillGrid), a 4px cell rather than 3. At 3 that was twice the cells the
  // fitted phone vine had, and repaint() went from 60 to 230ms a second on a
  // fast laptop -- most of a phone's frame. 4px brings the count back to what
  // the fitted vine drew. The beads stay big, because the zoom is the bake's.
  var CHAR_SIZE_FILL = 7;         // 0.602em advance x 7 = a 4px cell
  var FLOOR     = 16;             // black point: cells dimmer than this vanish
  // ...and the bake zeroes them too (bake.py --floor 16), so raising this past
  // 16 is free but lowering it finds nothing there: re-bake to match.
  var GAMMA     = 0.50;           // <1 lifts midtones, >1 crushes them
  // Darkest to lightest; first must be a space, and a ramp has to climb in INK
  // COVERAGE or a glyph lighter than the one before it reads as a dent.
  //
  // Growing dots, not the figure's " .:-=+*#%@". The vine is beads threaded on
  // near-vertical stems a cell or two wide, and -, = and + are all horizontal
  // bars: at that width every strand came out a stack of dashes that smeared
  // sideways into its neighbours, and the beads never resolved as round. Dots
  // have no direction to smear along, so the strands stay strands.
  var RAMP      = " ·.∙•○●■";
  var FLIP      = false;          // the vine has no handedness to correct

  // Brightness has to be its own channel. With a single ink colour the only
  // contrast available is ink COVERAGE, and a small glyph on black reads as
  // grey however bright that ink is -- which is why winding the gamma up only
  // ever traded ink for black without making anything stand out: it darkened
  // the haze and the beads together. So the grid is drawn once per band, each
  // layer a flat grey stepped off the clip's own luminance, where the shadows
  // sit near black and the lit beads reach white. Putting that range back is
  // what separates the beads from the haze they sit in. The page is monochrome
  // on purpose: red is spent on one thing only, the label under the pointer,
  // and a coloured vine would be competing with it the whole time.
  //
  // The bands are var() references rather than literals so that the palette
  // lives in one place -- the block at the top of the CSS -- instead of being
  // spread across the two BANDS arrays. A custom property
  // resolves at use time, so the five <pre>s are written once at build and
  // never touched again.
  //
  // The TOP band's glow is --bloom and not --ink-4 because a halo at the
  // core's own brightness has no edge against the core, so it stops reading
  // as a bloom and just hazes the vine.
  //
  // `upto` is the highest ramp index the band claims, so the bands have to be
  // in order and the last one has to reach the end of the ramp.
  var BANDS = [
    { upto: 1, color: "var(--ink-0)" },   // the haze around the stems: recedes
    { upto: 3, color: "var(--ink-1)" },   // stems
    { upto: 5, color: "var(--ink-2)", glow: "drop-shadow(0 0 3px var(--ink-2))" },   // the duller beads
    { upto: 6, color: "var(--ink-3)", glow: "drop-shadow(0 0 5px var(--ink-3)) drop-shadow(0 0 13px var(--ink-3))",
      glowFill: "drop-shadow(0 0 5px var(--ink-3))" },   // the lit ones
    { upto: 7, color: "var(--ink-4)", glow: "drop-shadow(0 0 6px var(--bloom)) drop-shadow(0 0 17px var(--bloom)) drop-shadow(0 0 38px var(--bloom))",
      glowFill: "drop-shadow(0 0 6px var(--bloom)) drop-shadow(0 0 17px var(--bloom))" }   // and their cores
  ];
  // `glowFill` is the glow on a phone, where the vine is drawn the full width
  // of the window (fillGrid) and so fills it with lit beads -- three times
  // the cores the fitted vine had, on twice the area, at 3x pixel density.
  // Each drop-shadow is a blur pass over the whole layer, and the passes
  // dropped are the two widest: the 38px haze off the cores and the 13px one
  // off the lit beads. What stays is the halo hugging each bead, which is the
  // part that reads as light; the far haze mostly brightened the black
  // between them, and on a screen this full of vine there is little black left.
  // Applied in finishGrid(), since a window can cross into or out of FILL.

  // The glow is a FILTER, not a text-shadow, and that is a performance
  // decision that happens to also look better. A text-shadow is blurred by
  // skia while the layer is being rastered -- once per shadow, at full device
  // resolution, every time the text changes. Six of them, one with an 80px
  // radius, on a layer the height of the window, 24 times a second, at 2x on a
  // retina display: that was the stutter, and it arrived a couple of seconds
  // in because the cost tracks how much of the vine has grown. A filter is
  // applied by the COMPOSITOR to the layer's finished texture, so the glyphs
  // raster once, plain, and the blur is a shader pass -- measured at 2x, the
  // whole glow now costs what no glow at all cost before (22ms/s of raster,
  // against 85). will-change:filter is what buys the separate layer; without
  // it the filter falls back into raster and the saving goes away.
  //
  // Chained drop-shadows compose: the second blurs the first's output, so the
  // falloff is softer than the same radii as separate text-shadows. That is
  // why these numbers are smaller than the ones they replace and the halo
  // still reads as wide.

  // The clip is not a loop. It opens on a second and a half of black, grows for
  // three and a half, and then has just under three of the grown vine swaying
  // -- barely one swing of its own 2.75s period, and a visibly damped one. So
  // playback is in two parts: the growth once, then the sway driven forever
  // across SWAY_A..SWAY_B by the two cosines below.
  // How the vine answers a bee that is eating it. The bee publishes where its
  // nose is (see BEE_BITE, in the other script); everything about what that does
  // to the picture is decided here, in the vine's own terms.
  //
  // The lift is PROPORTIONAL to the ink already in the cell, not added to it.
  // A flat add lights the black around the strand as readily as the strand, and
  // paints a visible disc of glyphs into empty space -- a spotlight on the vine
  // rather than the vine itself burning. Scaling what is there instead means the
  // strand and its haze come up together and the void stays void. BLOOM_HAZE is
  // the one concession: a small floor, so the faint cells just off the strand
  // have something to be scaled rather than nothing.
  //
  // Its ceiling is not a matter of taste. An empty cell is lifted by at most
  // BLOOM_AMP * BLOOM_HAZE, and FLOOR is the level below which the ramp draws a
  // space -- so the two together have to stay under FLOOR * maxLevel / 255, or
  // 3.95 here, and anything above that paints a dim blue disc of the bloom's own
  // shape into the black. Which is exactly what 6 did, once the falloff below
  // was widened enough for the rim to be somewhere you could see it.
  var BLOOM_HAZE = 2;             // levels of floor under the proportional lift

  var GROW_FROM = 32;             // first frame shown; the black lead-in, trimmed
  var SWAY_A    = 128;            // the arc the drive moves the vine across
  var SWAY_B    = 182;
  var SWAY_P1   = 6.4;            // seconds; the two never come back into step
  var SWAY_P2   = 9.7;            // for 10 minutes, so the sway never repeats
  var SWAY_MIX  = 0.62;           // how much of the swing P1 carries

  /* ---------------------------------------------------------------------- */

  // Which bake this window wants, by the global it assigns. The loader above
  // the script picked one of these at parse time; PHONE's change listener at
  // the foot of this script fetches the other when a window crosses over.
  var PHONE = window.matchMedia ? matchMedia("(max-width: 600px)") : { matches: false };
  var FILES = { ASCII_PLANT: "plant-frames.js", ASCII_PLANT_PHONE: "plant-frames-phone.js" };
  function wanted() { return PHONE.matches ? "ASCII_PLANT_PHONE" : "ASCII_PLANT"; }
  var data = window[wanted()] || window.ASCII_PLANT || window.ASCII_PLANT_PHONE;
  var stack = document.getElementById("stack");
  var pres = BANDS.map(function (b, i) {
    var el = document.createElement("pre");
    el.style.color = b.color;
    if (b.glow) { el.style.filter = b.glow; el.style.willChange = "filter"; }
    stack.appendChild(el);
    return el;
  });
  var pre = pres[0];              // the layer in flow: it sizes the stack
  if (!data) {
    pre.textContent = "no payload -- see README.md for the bake that makes plant-frames.js";
    stack.style.opacity = 1;
    return;
  }

  // The payload is a high-resolution MASTER. The grid actually drawn is derived
  // from the vine's size and CHAR_SIZE, and the master is resampled into it, so
  // a smaller vine means FEWER characters rather than smaller ones.
  //
  // Everything below that describes the master is set here and nowhere else,
  // because the master can change under a running page: a window dragged
  // across the phone breakpoint swaps the whole vine for its zoomed bake.
  var mCols, mRows, cells, ASPECT, CELL, deltas, total, maxLevel, FILL;
  function usePayload(d) {
    data = d;
    mCols = d.cols; mRows = d.rows; cells = mCols * mRows;
    ASPECT = mCols / mRows;
    // How the bake asks to be placed (bake.py --fill): absent, the whole vine
    // fitted to the window; "width", the phone's window onto the vine.
    FILL = d.fill || "";
    // The cell's height over its width, and the payload's to say: a master is
    // baked against a cell shape (bake.py --cell), and ASPECT above is only the
    // vine's true shape when the grid is drawn on that same cell. Square for the
    // vine; a payload from before the field existed was baked at the old 1:2.
    CELL = d.cell || 2;
    deltas = d.deltas; total = deltas.length + 1;
    maxLevel = d.levels - 1;
    lut = new Array(d.levels);
    band = new Uint8Array(d.levels);
  }

  /* ---- decoder -------------------------------------------------------- */

  var B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  var V = new Uint8Array(128);
  for (var i = 0; i < B64.length; i++) V[B64.charCodeAt(i)] = i;

  var levels = null;              // what repaint() reads
  var cache = null;
  // The spaces at the end of a line draw nothing and cost exactly what ink
  // costs to shape. See repaint(), where they come off.
  var TRAIL = / +(?=\n|$)/g;
  var painted = [];               // the string each layer is currently showing
  var blend = null;               // where a between-frames position is mixed
  var lut, band;                  // sized by usePayload(), filled by buildLut()
  var TAU = Math.PI * 2;
  usePayload(data);

  function applyDelta(buf, s) {
    var p = 0, idx = 0, len = s.length;
    while (p < len) {
      var shift = 0, gap = 0, c;
      do { c = V[s.charCodeAt(p++)]; gap |= (c & 31) << shift; shift += 5; } while (c & 32);
      idx += gap;
      buf[idx] = V[s.charCodeAt(p++)];
    }
  }

  // Deltas are sequential, so the decoder can only ever go forward -- but the
  // sway loop has to come back to LOOP_A, and the growth has to start partway
  // in at GROW_FROM. So decode the clip once, up front, and keep all of it:
  // 192 frames x 40800 cells is 7.8 MB, after which showing any frame is a
  // subarray view. No copy, no re-decode, and backwards costs what forwards does.
  //
  // Kept on the payload it was decoded from, so a window that crosses the
  // phone breakpoint and comes back finds its first vine already decoded.
  function buildCache() {
    blend = new Float32Array(cells);
    if (data.cache) { cache = data.cache; return; }
    var work = new Uint8Array(cells), f;
    for (var j = 0; j < cells; j++) work[j] = V[data.key.charCodeAt(j)];
    cache = new Uint8Array(total * cells);
    cache.set(work, 0);
    for (f = 1; f < total; f++) {
      applyDelta(work, deltas[f - 1]);
      cache.set(work, f * cells);
    }
    data.cache = cache;
  }

  // A whole frame costs nothing -- it is a view straight into the cache. A
  // position between two frames mixes them, which the sway needs because it
  // moves the vine at its own pace rather than the clip's. The drive never runs
  // faster than the rate this was filmed at, so that is always an interpolation
  // between neighbouring frames and never a blur across a skipped one.
  function showAt(p) {
    var i = p | 0, u = p - i;
    if (u < 1e-4 || i >= total - 1) {
      levels = cache.subarray(i * cells, (i + 1) * cells);
      return;
    }
    var a = i * cells, b = a + cells, v = 1 - u;
    for (var k = 0; k < cells; k++) blend[k] = cache[a + k] * v + cache[b + k] * u;
    levels = blend;
  }

  // level -> character, and level -> which layer draws it. Both fall out of the
  // same tone curve, so a cell is looked up once and the band comes for free.
  //
  function buildLut() {
    var span = data.white - FLOOR, b;
    for (var lv = 0; lv <= maxLevel; lv++) {
      var v = (lv * 255 / maxLevel - FLOOR) / span;
      v = v < 0 ? 0 : v > 1 ? 1 : Math.pow(v, GAMMA);
      var ci = Math.round(v * (RAMP.length - 1));
      lut[lv] = RAMP.charAt(ci);
      for (b = 0; b < BANDS.length - 1 && ci > BANDS[b].upto; b++) {}
      band[lv] = b;
    }
  }

  /* ---- display grid ---------------------------------------------------- */

  // Monospace advance width varies by font, so measure it rather than assuming
  // 0.6em -- guessing would distort the vine. Cells must end up exactly the
  // shape the bake grid was chosen against -- CELL, from the payload.
  var advanceRatio = 0.6;
  var gCols = 0, gRows = 0, layers = [], colW = null, rowW = null, tmp = null;
  var mRowsUsed = 0;

  // Where the vine is burning, for the ash script at the foot of the file to
  // shed from. Every cell repaint() puts in the two brightest bands -- the lit
  // beads and their cores -- written as (row * gCols + col) * 2, plus one for a
  // core. Collected inside the loop that already decides each cell's band, so
  // it costs one compare a cell and no pass of its own. Published the same way
  // BEE_BITE is read, in the other direction: one plain value, nothing read
  // back, and re-validated by whoever reads it. WHEN to shed is not the vine's
  // to say -- the ash waits on the nav, the way the bee does.
  //
  // The bite goes along with it, in the same grid cells repaint() just used to
  // light the patch, so the ash can burn hardest exactly where the vine does.
  var embers = null, nEmbers = 0;
  function publishEmbers() {
    window.VINE_EMBERS = { cells: embers, n: nEmbers, cols: gCols, rows: gRows,
      bite: bite && { col: bite.col, row: bite.row, rc: bite.rc, rr: bite.rr, amp: bite.amp } };
  }

  // #stack's box, measured lazily and kept. It is fixed once the grid exists --
  // every layer is gRows full lines whether or not there is any vine in them, so
  // the box does not grow as the plant does -- and only buildGrid() can change
  // it. Measuring per repaint instead would force a layout thirty times a second
  // for a number that changes on resize and never otherwise. Height is the test
  // rather than existence: at start() the grid is built before anything is
  // painted into it, so the first measurement is legitimately zero.
  var stackRect = null;
  function stackBox() {
    if (!stackRect || !stackRect.height) stackRect = stack.getBoundingClientRect();
    return stackRect;
  }

  function measure() {
    var probe = document.createElement("canvas").getContext("2d");
    var style = getComputedStyle(pre);
    probe.font = style.fontWeight + " 100px " + style.fontFamily;
    var w = probe.measureText("MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM").width;
    if (w > 0) advanceRatio = w / 40 / 100;

    // One font or no grid. If the ramp reaches outside the family the fallback
    // brings its own advance with it, and the layers quietly stop sharing
    // columns -- which reads as a slightly fuzzy vine, not as a bug, which is
    // exactly why it needs saying out loud.
    for (var r = 1; r < RAMP.length; r++) {
      if (Math.abs(probe.measureText(RAMP.charAt(r)).width - w / 40) > 0.5) {
        console.warn("plant: " + style.fontFamily + " has no '" + RAMP.charAt(r) +
          "' -- the fallback's advance will pull the colour layers out of column");
        break;
      }
    }
  }

  // Area-weighted resampling weights, as a flat CSR-style table.
  //
  // Partial source cells MUST contribute fractionally. Snapping each output
  // cell to whole source cells looks harmless but is not: at a ratio near 2.06
  // some outputs average 2 source rows and others 3, which on thin diagonal
  // structures -- and this subject is almost nothing but thin diagonal stems --
  // reads as stair-stepping.
  //
  // `span` is how many of the src cells the dst cells cover, from the first:
  // all of them when the whole vine is on screen, and fewer when a zoomed vine
  // runs off the window's edge and only the part still inside it is drawn.
  function buildWeights(dst, src, span) {
    var start = new Int32Array(dst + 1), idx = [], w = [];
    span = Math.min(span || src, src);
    for (var i = 0; i < dst; i++) {
      start[i] = idx.length;
      var a = i * span / dst, b = (i + 1) * span / dst;
      var hi = Math.min(Math.ceil(b), src), sum = 0;
      for (var j = Math.floor(a); j < hi; j++) {
        var overlap = Math.min(b, j + 1) - Math.max(a, j);
        if (overlap > 0) { idx.push(j); w.push(overlap); sum += overlap; }
      }
      for (var k = start[i]; k < w.length; k++) w[k] /= sum;
    }
    start[dst] = idx.length;
    return { start: start, idx: new Int32Array(idx), w: new Float32Array(w) };
  }

  function buildGrid() {
    if (FILL === "width") return fillGrid();
    var cellW = advanceRatio * CHAR_SIZE, cellH = CELL * cellW;
    // No 0.94 here, unlike a centred figure: the vine hangs from the top edge,
    // so the margin it wants above it is none at all. SCALE alone decides how
    // far down the window it reaches.
    var availH = window.innerHeight * SCALE;
    var availW = window.innerWidth * 0.96 * SCALE;

    var r = Math.round(availH / cellH);
    var c = Math.round(r * ASPECT);
    if (c * cellW > availW) { c = Math.floor(availW / cellW); r = Math.round(c / ASPECT); }

    gRows = Math.max(8, Math.min(r, mRows));
    gCols = Math.max(6, Math.min(c, mCols));

    // The master can run out before the window does. When the master was
    // 200 rows, that was 963px of vine at the tuned cell, so a viewport taller
    // than about 1000px -- a 16" laptop is 1117, a full-screen 27" is 1440, and
    // Safari's thinner toolbar gets there before Chrome's does on the same
    // display -- left the vine hanging short of the floor with black underneath
    // it, filling 86% or 67% of the height SCALE promised. 400 rows at 3px
    // moves the edge out to about 1240px, but a full-screen 27" is still past it. It reads as the plant having stopped
    // growing, which on a page whose whole subject is growth is the one thing
    // it must not look like.
    //
    // So the cell is the free variable, not the height. The row count is
    // decided first, against the master's limit; then the size is whatever
    // makes those rows fill the window, which means a big display buys BIGGER
    // beads once it can no longer buy more of them. Below the cap this changes
    // nothing -- the arithmetic hands back the CHAR_SIZE it started from -- and
    // the width term keeps a narrow window from pushing the vine out of frame.
    var size = Math.min(availH / (gRows * CELL * advanceRatio),
                        availW / (gCols * advanceRatio));

    // ...but the ROW PITCH it implies has to be a whole CSS pixel, because
    // Safari floors the used line-height to one and Chrome keeps it to 1/64.
    // Measured in Safari 26: every line-height from 3.0 to 3.9 is laid out at
    // 3, and 4.0 to 4.9 at 4, in px or in em alike. So the fractional pitch the
    // arithmetic above hands back fills the window in Chrome and falls up to a
    // pixel per row short in Safari -- at innerHeight 721 it asked for 3.4968
    // and got 3, so 200 rows came out 600px instead of 699, 83% of the viewport
    // where SCALE promised 97%. The same bug the note above describes, from the
    // other end, and worse than short: the ADVANCE stays fractional while the
    // pitch is truncated, so the cell loses the shape the bake grid assumes and
    // the vine is squashed as well as stunted.
    //
    // So the pitch is what gets chosen, and the font size is read off it rather
    // than the other way round. At lineHeight = pitch and fontSize =
    // pitch / (CELL * advance) the cell is exactly pitch/CELL x pitch in every
    // engine -- the bake's shape by construction, with nothing left to round. Rounding to nearest
    // rather than down keeps the vine in contact with the floor, and can ask
    // for at most half a pixel per row more than there is, so give a row back
    // when it does. index.html solves this by measuring the honoured line box
    // instead (see cell()); this is the same fix without the second reflow.
    var pitch = Math.max(2, Math.round(size * CELL * advanceRatio));
    if (gRows * pitch > availH) gRows = Math.max(8, Math.floor(availH / pitch));
    size = pitch / (CELL * advanceRatio);
    finishGrid(pitch, size, mCols, mRows);
  }

  // The phone's vine: not the whole plant fitted into half a window, but a
  // window onto the plant -- a strip of the footage from a little left of the
  // vine to partway through it, starting partway down, with the vine coming in
  // from the top edge and running off the right and bottom ones. Fitted, a
  // phone drew the whole plant on the same 3px cells as a desktop in half the
  // window's width, and a bead was a dot or two; here the beads are about
  // twice that, and -- the bake is that strip of the footage at its own
  // density, not the desktop master blown up -- have the detail to match.
  //
  // The strip is the bake's crop (bake.py --fill width, and README.md), so all
  // the page has to do is lay its width across the window. The composition
  // then holds on any phone: the same black on the left for the words, the
  // same cut on the right, and a taller phone sees further down. Only the rows
  // inside the window are drawn, so the overflow is the crop's and the grid
  // never pays for a cell off screen. #stack is still exactly the grid, so the
  // bee, the nav and the ash, which all read the vine off its box and its
  // stamp, need to know nothing about any of this.
  function fillGrid() {
    // the pitch CHAR_SIZE_FILL asks for, whole-pixel for Safari's sake as
    // above; the bake's width fills the window whatever the cell count comes to
    var pitch = Math.max(2, Math.round(CHAR_SIZE_FILL * CELL * advanceRatio));
    var cellW = pitch / CELL;
    gCols = Math.max(6, Math.round(window.innerWidth / cellW));
    // the master's whole height in this grid's rows, at the width it is drawn
    var allRows = gCols * CELL / ASPECT;
    gRows = Math.max(8, Math.min(Math.ceil(window.innerHeight / pitch), Math.floor(allRows)));
    finishGrid(pitch, pitch / (CELL * advanceRatio), mCols, gRows * mRows / allRows);
  }

  // The half of building a grid that does not care how its size was decided:
  // gCols x gRows cells, `pitch` px apart, drawn from the first spanC x spanR
  // cells of the master.
  function finishGrid(pitch, size, spanC, spanR) {
    stackRect = null;           // the grid decides the box; it has just changed
    painted.length = 0;         // ...so nothing on screen matches anything held
    layers = BANDS.map(function () { return new Array(gRows * (gCols + 1)); });
    embers = new Int32Array(gRows * gCols);
    colW = buildWeights(gCols, mCols, spanC);
    rowW = buildWeights(gRows, mRows, spanR);
    // the master rows those cells reach, which repaint()'s first pass need
    // not look past -- all of them when the whole vine is drawn
    mRowsUsed = Math.min(mRows, Math.ceil(spanR));
    tmp = new Float32Array(mRows * gCols);

    // The box, written down rather than left to the text. `contain: size` in
    // the CSS is the half of this that makes it binding; these are the numbers
    // it binds to, and they are exactly the ones the untrimmed grid used to
    // arrive at by itself -- columns times the cell, rows times the pitch. Not
    // rounded: the vine is centred by the grid's `place-items`, and rounding
    // here would shift it half a pixel off centre for no reason.
    var boxW = gCols * size * advanceRatio, boxH = gRows * pitch;
    stack.style.width = boxW + "px";
    stack.style.height = boxH + "px";

    // ...and the shape of the grid, said out loud. Two other scripts read this
    // vine off the screen -- the bee's inkEdge() and the nav's front() -- and
    // both used to take the column count from the length of a rendered line.
    // Trimming the trailing spaces takes that away, so the grid publishes it
    // instead. Same contract as BEE_BITE, in the other direction: one plain
    // value, nothing read back, and re-validated by whoever reads it.
    stack.dataset.cols = gCols;
    stack.dataset.rows = gRows;

    for (var L = 0; L < pres.length; L++) {
      pres[L].style.fontSize = size + "px";
      var glow = (FILL && BANDS[L].glowFill) || BANDS[L].glow;
      if (glow && pres[L].style.filter !== glow) pres[L].style.filter = glow;
      pres[L].style.lineHeight = pitch + "px";
      pres[L].style.width = boxW + "px";
      pres[L].style.height = boxH + "px";
    }
  }

  // Where the bee's nose is, in this grid's own cells -- or null, which is the
  // answer nearly all the time and the answer this script is built to give.
  //
  // The bee is a separate IIFE with its own clock and its own bugs, and this is
  // the only thing it ever says to the vine. So nothing it says is trusted: the
  // whole message is re-validated here, once per repaint, and anything missing,
  // half-written or not a finite number leaves `bite` null and the vine painting
  // exactly what it would have painted with no bee on the page at all.
  var bite = null, biteKey = "";
  function readBite() {
    bite = null;
    var b = window.BEE_BITE;
    if (!b || !gCols || !gRows) return;
    var bx = +b.x, by = +b.y, br = +b.r, amp = +b.amp;
    if (!isFinite(bx) || !isFinite(by) || !(br > 0) || !(amp > 0)) return;
    var r = stackBox();
    if (!r.width || !r.height) return;
    var cw = r.width / gCols, ch = r.height / gRows;
    // rc and rr are the same radius in px measured in columns and in rows, which
    // need not be the same size: on any cell that is not square a round patch
    // on screen is an ellipse in the grid and the falloff below has to be normalised by
    // each axis separately or the bloom comes out a stripe.
    bite = { col: (bx - r.left) / cw, row: (by - r.top) / ch,
             rc: br / cw, rr: br / ch, amp: amp };
  }

  // Resample the master into the display grid and map through the ramp.
  // Separable: horizontal pass into tmp[], then vertical straight into the
  // layers. A cell's glyph goes to the layer its band names and every other
  // layer gets a space there, so the layers are disjoint and stacking them
  // reassembles the one grid -- in three colours instead of one.
  function repaint() {
    var y, j, k, e, s, L, NL = layers.length;
    nEmbers = 0;
    for (y = 0; y < mRowsUsed; y++) {
      var off = y * mCols, to = y * gCols;
      for (j = 0; j < gCols; j++) {
        s = 0;
        for (k = colW.start[j], e = colW.start[j + 1]; k < e; k++)
          s += levels[off + colW.idx[k]] * colW.w[k];
        tmp[to + j] = s;
      }
    }
    for (var i = 0; i < gRows; i++) {
      var base = i * (gCols + 1);
      // The bloom is a disc, so each row knows its own span of it before the row
      // is walked: outside that span there is no test to do and no cost to pay.
      // dr of 9 with no bite parks every row outside it, so the inner loop below
      // is two integer compares away from the code that was here before.
      var dr = bite ? (i - bite.row) / bite.rr : 9, jlo = 1, jhi = 0, half;
      if (dr > -1 && dr < 1) {
        half = Math.sqrt(1 - dr * dr) * bite.rc;
        jlo = Math.max(0, Math.ceil(bite.col - half));
        jhi = Math.min(gCols - 1, Math.floor(bite.col + half));
      }
      for (j = 0; j < gCols; j++) {
        s = 0;
        for (k = rowW.start[i], e = rowW.start[i + 1]; k < e; k++)
          s += tmp[rowW.idx[k] * gCols + j] * rowW.w[k];
        // Inside the bite: lift the level, and let the tone curve do the rest.
        // Nothing here knows about colour or glow -- the cell simply climbs the
        // ramp, and buildLut() has already decided that a higher level means a
        // denser glyph in a brighter layer with a wider halo under it. That is
        // the whole of the plant's reaction to being eaten, and it is four lines
        // because the machinery to make it look like that was already here.
        if (j >= jlo && j <= jhi) {
          var dc = (j - bite.col) / bite.rc;
          var dd = dc * dc + dr * dr;
          // A bell, flat at the centre and flat again at the rim: (1-d^2)^2,
          // which needs no sqrt. The obvious (1-d)^2 was tried first and is the
          // wrong shape for this picture -- the tone curve is a square root, so
          // a cell has to gain about half its own value again before it moves
          // one step up the ramp, and a falloff that steep only ever cleared
          // that bar within a sixth of the radius. The bloom came out a hard
          // little dot the size of the bee's head. This one holds most of its
          // height out to two thirds of the way, which is what makes it a patch
          // of lit plant rather than a spotlight.
          if (dd < 1) { var f = 1 - dd; s += bite.amp * f * f * (s + BLOOM_HAZE); }
        }
        var lv = Math.round(s);
        lv = lv < 0 ? 0 : lv > maxLevel ? maxLevel : lv;
        // reversing the column is the horizontal flip: mirroring the element
        // with scaleX(-1) would mirror the glyphs too and leave them backwards
        var col = FLIP ? gCols - 1 - j : j, at = base + col, b = band[lv];
        for (L = 0; L < NL; L++) layers[L][at] = " ";
        layers[b][at] = lut[lv];
        if (b >= NL - 2) embers[nEmbers++] = (i * gCols + col) * 2 + (b === NL - 1 ? 1 : 0);
      }
      // no trailing newline on the last row -- it would add an extra line box
      var nl = (i === gRows - 1) ? "" : "\n";
      for (L = 0; L < NL; L++) layers[L][base + gCols] = nl;
    }
    for (L = 0; L < NL; L++) {
      // Two economies, and between them they are most of what a repaint costs.
      //
      // The first is the trailing spaces. A line is gCols wide in every layer,
      // but on the two brightest ones nearly all of it is empty -- a core here,
      // another forty columns along, and nothing after the last of them -- and
      // Chrome re-shapes every one of those spaces each time the text changes.
      // Stripping them took the grid's layout from 2.4ms a repaint to 1.4ms,
      // measured at 1600x1000 on a 2x display, and roughly halved the raster
      // behind it. It is safe only because buildGrid pins the box: a <pre> left
      // to size itself would come out a different width on every layer.
      //
      // The second is not writing at all. textContent is what invalidates a
      // layer, and an invalidated layer is re-shaped, re-rastered AND re-blurred
      // -- and the blur is by a long way the most expensive thing on this page.
      // So a layer about to be handed the string it already has is left alone.
      // The compare is over characters that have just been built anyway, and at
      // the turns of the sway, where the vine is barely moving, it skips nearly
      // all of them.
      var text = layers[L].join("").replace(TRAIL, "");
      if (text !== painted[L]) { painted[L] = text; pres[L].textContent = text; }
    }
    publishEmbers();
  }

  /* ---- playback -------------------------------------------------------- */

  var t0 = 0, hiddenAt = 0, shown = -1;
  var GROW_SECS = (SWAY_B - GROW_FROM) / data.fps;
  var SWAY_MID = (SWAY_A + SWAY_B) / 2, SWAY_AMP = (SWAY_B - SWAY_A) / 2;

  // Where in the clip to stand, in frames, at t seconds.
  //
  // The growth is the clip's own and plays at the rate it was filmed at, whole
  // frame by whole frame. The sway cannot be: there is only one swing of
  // footage, it is damped, and looping it any of the obvious ways gives itself
  // away. A cut back to the start jumps -- even the best-matching pair in the
  // quiet tail is five to eight times a frame of local motion, which in an
  // almost still picture reads as a twitch. Running it forwards and backwards
  // at a constant rate never jumps, but turns on a sixpence at each end and
  // plays the damping in reverse, so the vine visibly gathers energy.
  //
  // So drive the position instead of stepping it, with two cosines of unrelated
  // period. Position is continuous, so nothing ever jumps; velocity is too, so
  // there is no bounce at the turns; and because the two periods only come back
  // into step every ten minutes, the turning points land somewhere new every
  // time and the sway never settles into a rhythm the eye can catch. Both start
  // at 1, which puts t=0 at SWAY_B with the vine momentarily still -- exactly
  // where the growth leaves it, so the two halves meet without any fitting.
  function positionAt(t) {
    if (t < GROW_SECS) return GROW_FROM + t * data.fps;
    var s = t - GROW_SECS;
    return SWAY_MID + SWAY_AMP * (
      SWAY_MIX * Math.cos(TAU * s / SWAY_P1) +
      (1 - SWAY_MIX) * Math.cos(TAU * s / SWAY_P2));
  }

  // Repainting is not free and rAF is not a budget. A repaint rewrites the
  // textContent of all five layers, and Chrome answers that by re-shaping every
  // line of every layer and re-rastering the glow underneath them -- together
  // about 8ms of a 1440x900 window, which a 120Hz display asks for every 8.3ms.
  // That is what the stutter is: the work is per REPAINT, and rAF was asking
  // for one per refresh, so the faster the screen the further behind it fell.
  //
  // So paint on the clip's terms instead of the display's. The growth IS a
  // 24fps clip, and rounding the position to whole frames both pins it to that
  // rate and skips the blend, since a whole frame is a view into the cache and
  // costs nothing to show -- interpolating footage back onto its own frame
  // times only ever cost time. The sway has no native rate, being driven rather
  // than played, so it gets one: 30Hz is well past the point where a drift this
  // slow reads as continuous, and halves the work again.
  var SWAY_HZ = 30;
  // ...and a ceiling is only half of it, because between two ticks 33ms apart
  // the drive often has not moved the vine far enough to change a single cell.
  // The position is continuous and the picture is not: it is a grid of rounded
  // levels, and the sway crosses the whole 54-frame arc in six and a half
  // seconds, so at the turns it can spend the better part of a second inside
  // one frame of footage. Quantising the position to halves of a frame is what
  // lets the guard below see that and do nothing -- the repaint then happens
  // when the PICTURE changes rather than when the clock says it may, which at
  // the ends of each swing is a good deal less often. Half a frame of a 24fps
  // clip is 21ms of a motion this slow: below anything the eye resolves, and
  // well inside the cell the vine is drawn on.
  var SWAY_STEP = 2;              // steps per clip frame the sway lands on
  var lastPaint = -1e9;

  function tick(now) {
    if (!t0) t0 = now;
    var t = (now - t0) / 1000;
    var p = positionAt(t);
    if (t < GROW_SECS) p = Math.round(p);
    else if (now - lastPaint < 1000 / SWAY_HZ) { requestAnimationFrame(tick); return; }
    else p = Math.round(p * SWAY_STEP) / SWAY_STEP;
    readBite();
    // A bite that has moved is a repaint in its own right: the vine can be
    // standing on the same frame while the bloom on it is still swelling. Held
    // to the sway's rate and not the display's, because the branch above does
    // not gate during the growth, and a bite alone would otherwise ask for a
    // repaint every refresh. Quantised to whole cells, which is the finest the
    // grid can show anyway, so a bee holding station re-paints nothing.
    var key = bite ? (bite.col | 0) + "," + (bite.row | 0) + "," +
                     Math.round(bite.amp * 20) : "";
    if (p !== shown || (key !== biteKey && now - lastPaint >= 1000 / SWAY_HZ)) {
      shown = p; lastPaint = now; biteKey = key; showAt(p); repaint();
    }
    requestAnimationFrame(tick);
  }

  document.addEventListener("visibilitychange", function () {
    // Don't count hidden time as elapsed. The position is closed-form, so there
    // is no catch-up to cap any more -- but a tab brought back after a minute
    // should carry on from where it was rather than from wherever the clock got
    // to, and a growth watched half way through should still finish.
    // performance.now() shares its time origin with the rAF timestamp, so the
    // two are the same clock.
    if (document.hidden) hiddenAt = performance.now();
    else if (hiddenAt) { t0 += performance.now() - hiddenAt; hiddenAt = 0; }
  });

  window.addEventListener("resize", function () { buildGrid(); repaint(); });

  // The opening again, from the top. The position is closed-form in t, so
  // rewinding is forgetting when it started: tick() takes the next frame as
  // t=0 and grows the vine out of black exactly as on load. shown and
  // lastPaint are cleared so that first frame is painted, not skipped as
  // already on screen.
  document.addEventListener("misket:replay", function () {
    t0 = 0; hiddenAt = 0; shown = -1; lastPaint = -1e9;
  });

  var started = false;
  function start() {
    measure();
    buildLut();
    buildGrid();
    buildCache();
    showAt(GROW_FROM);
    repaint();
    stack.classList.add("ready");
    started = true;
    requestAnimationFrame(tick);
    // a window that crossed the breakpoint while the font was loading
    swapPayload();
  }

  // A window that crosses the phone breakpoint -- a phone turned on its side,
  // a desktop window dragged narrow -- wants the other bake. The loader only
  // fetched one, so fetch the other the first time it is asked for and swap to
  // it when it lands, asking the question again then rather than trusting the
  // answer from before the download. Until it lands the vine it already has
  // carries on, laid out by its own rule. Same source, same fps, same frame
  // count, so the clock and every frame number above carry straight across.
  var fetching = {};
  function swapPayload() {
    var name = wanted(), d = window[name];
    if (!started) return;
    if (!d) {
      if (fetching[name]) return;
      fetching[name] = true;
      var s = document.createElement("script");
      s.src = FILES[name];
      s.onload = swapPayload;
      s.onerror = function () { console.warn("plant: could not load " + FILES[name]); };
      document.head.appendChild(s);
      return;
    }
    if (d === data) return;
    if (d.deltas.length + 1 !== total)
      console.warn("plant: " + FILES[name] + " has a different frame count -- re-bake both");
    usePayload(d);
    buildLut();
    buildGrid();
    buildCache();
    showAt(shown >= 0 ? shown : GROW_FROM);
    repaint();
  }
  if (PHONE.addEventListener) PHONE.addEventListener("change", swapPayload);
  else if (PHONE.addListener) PHONE.addListener(swapPayload);

  // fonts.ready on its own does not wait for MisketRamp: the layers are empty
  // until start() fills them, so nothing has asked for that face yet and ready
  // resolves without it -- and measure() would time the wrong font. So ask for
  // it by name first. A failed load still starts; the stack's fallback decides.
  if (document.fonts && document.fonts.load)
    document.fonts.load('10px "MisketRamp"', RAMP + "M")
      .catch(function () {})
      .then(function () { return document.fonts.ready; })
      .then(start);
  else start();
})();
</script>

<script>
/* ---- the bee -----------------------------------------------------------
   Deliberately self-contained: its own IIFE, its own rAF, no reference to
   anything in the vine's script. The vine is a decoder with a playback clock
   and the bee is a 12x12 sprite with a spring in it; they share only
   the window and the z-index ladder, so a mistake in here cannot stop the
   plant from growing. */
(function () {
  "use strict";

  /* ---- everything adjustable, in one place ----------------------------- */

  var OMEGA   = 3.4;    // spring stiffness; settles a long leg in ~1.4s
  var DWELL   = 1.5;    // seconds spent at a button before moving on
  var ARRIVE  = 8;      // px from the aim point that counts as arrived
  var CALM    = 30;     // ...but only once it is slower than this, px/s
  var EAT_GAP = 2;      // px between the bee's nose and the strand it is eating
  var EAT_PCT = 0.25;   // how far in from the outermost strand it settles, 0..1
