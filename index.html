  function forgetRects() { stackRect = null; btnRects = []; }

  // The rotation's route: the word below this one, or back to the top. Read
  // off the rects and not the source order, because on a phone the four are
  // stacked in a different order from the one they are written in, and a bee
  // stepping through the HTML zigzagged up and down the column. On desktop the
  // two orders are the same and so is the route.
  function byHeight() {
    return buttons.map(function (b, k) { return k; })
      .sort(function (a, b) { return btnBox(a).top - btnBox(b).top; });
  }
  function nextDown(i) {
    var order = byHeight();
    return order[(order.indexOf(i) + 1) % order.length];
  }

  function vineLines() {
    if (vineGrid && clock - vineAt < VINE_SAMPLE) return vineGrid;
    vineAt = clock;
    vineGrid = vinePres.slice(2).map(function (p) { return p.textContent.split("\n"); });
    return vineGrid;
  }

  // px of the plant's edge on the given side, at the height cy: the rows the bee
  // covers are each measured, and a quantile of them answers -- see below. null
  // when that band is empty (out past the tip of the vine, say), and the caller
  // falls back to the box edge.
  function inkEdge(cy, left) {
    var g = vineLines();
    if (!g.length || !g[0].length) return null;
    var r = stackBox();
    if (!r.width || !r.height) return null;
    // Off the grid's own stamp, not off the length of a rendered line: repaint()
    // strips the trailing spaces now, so lines are no longer all one width and
    // the text can no longer be asked how wide the grid is. Re-validated here
    // like everything else this script reads from outside itself.
    var rows = +stack.dataset.rows, cols = +stack.dataset.cols;
    if (!(rows > 0) || !(cols > 0)) return null;
    var ch = r.height / rows, cw = r.width / cols;
    // the rows the sprite covers, and every one of them counts: the quantile
    // below needs a population, and one row is not one
    var lo = Math.max(0, Math.floor((cy - halfH - r.top) / ch));
    var hi = Math.min(rows - 1, Math.ceil((cy + halfH - r.top) / ch));
    var per = [], best, line, i, k, L;
    for (i = lo; i <= hi; i++) {
      best = -1;
      for (L = 0; L < g.length; L++) {
        line = g[L][i];
        if (!line) continue;
        // Walk in from the side being measured and stop at the first glyph --
        // except that on the right there is nothing to walk. repaint() ends
        // every line on ink, so the last character IS the rightmost glyph and
        // the scan is a subtraction. (Which also means charAt can no longer be
        // asked past the end of a line, where it answers "" and would have been
        // read as ink.)
        if (left) {
          k = 0;
          while (k < line.length && line.charCodeAt(k) === 32) k++;
          if (k >= line.length) continue;
        } else {
          k = line.length - 1;
        }
        if (best < 0 || (left ? k < best : k > best)) best = k;
      }
      if (best >= 0) per.push(best);
    }
    if (!per.length) return null;
    // A QUANTILE of those rows, not the outermost of them. The vine's silhouette
    // is ragged and it sways, so at any height one strand can be flung fifty
    // pixels past the rest for a few frames; aiming at the extreme hands that
    // strand the whole aim, and the bee backs off the plant to respect a twig.
    // The median is steady but it is the edge of the MASS, and a bee parked
    // there is buried in beads and cannot be picked out at all. A quarter of the
    // way in is the fringe: past the outliers, still outside the thick of it.
    per.sort(function (a, b) { return a - b; });
    var q = Math.round((per.length - 1) * EAT_PCT);
    var col = left ? per[q] : per[per.length - 1 - q];
    return r.left + (left ? col * cw : (col + 1) * cw);
  }

  // Straight off the live DOM, never off the CSS percentages. Those are
  // relative to #stack, which is sized by the vine's own grid maths and changes
  // on every resize; the rect is the one number that is true whatever the grid
  // decided. Recomputed at the start of each leg, so the aim follows the nav
  // through a relayout without the bee knowing anything about the vine.
  //
  // The button says WHICH SIDE and HOW HIGH; the plant says how far in. The
  // height is taken off the label, so the bee still reads as belonging to that
  // word, but x is measured off the vine -- the bee is here to eat, and the
  // plant is the thing it has to be next to.
  function aimAt(i) {
    var r = btnBox(i);
    // the side of the VINE, not of the window: they are the same line while it
    // hangs centred, and on a phone it hangs from the right, where a long word
    // like PHOTOGRAPHY can straddle the window's middle and still be the vine's
    // left-hand word
    var sb = stackBox();
    var mid = (sb.left + sb.right) / 2;
    var left = (r.left + r.right) / 2 < mid;
    var y = (r.top + r.bottom) / 2 - LIFT;
    // INSIDE the label, in the gap it leaves between itself and the vine, nose
    // to the nearest strand at its own height. The sign comes from the rect, so
    // both columns fall out of one line; `face` is the pose the arrival holds --
    // always at the plant.
    var edge = inkEdge(y, left);
    if (edge === null) {
      var s = stackBox();
      edge = left ? s.left : s.right;
    }
    var x = left ? edge - halfW - EAT_GAP : edge + halfW + EAT_GAP;
    return {
      x: Math.max(halfW + 4, Math.min(window.innerWidth - halfW - 4, x)),
      y: Math.max(halfH + 4, Math.min(window.innerHeight - halfH - 4, y)),
      face: left ? "right" : "left"
    };
  }

  /* ---- state ------------------------------------------------------------ */

  var autoIndex = 0;      // where the unattended rotation is up to
  var hoverIndex = -1;    // the button under the pointer, if any, which wins
  var legIndex = -1;      // the target the current leg was aimed at
  var target = { x: 0, y: 0 };
  var x = 0, y = 0, vx = 0, vy = 0;
  var arrived = false, dwell = 0;
  var legFace = "right";  // the pose this leg parks in, which is at the plant
  var eatT = 0;           // seconds since it settled; drives the nibble, alone
  var reaimT = 0;         // and since the aim was last re-taken at the plant
  var facing = "right", frame = 0, flapT = 0, drawn = "";
  var last = 0, clock = 0;
  var feed = 0;           // 0..1, the swell: everything about the meal rides it
  var beeReady = false;   // the bee is on screen -- nothing lights before that
  var glowShown = -1;     // the halo width last written, quantised

  function active() { return hoverIndex >= 0 ? hoverIndex : autoIndex; }

  // The label the bee is feeding at, lit the way a pointer lights one. -1 for
  // none. The walk in index.html marks its list with this same attribute and for
  // the same reason: the travel is the gesture, the colour is the arrival, and
  // they are not allowed to overlap -- so the list goes plain the moment the bee
  // leaves and one word answers when it settles. :hover is a separate rule and
  // still answers on its own frame, which is what makes a pointer feel instant.
  function lit(i) {
    // Nothing is lit before the bee is visible. start() parks it on button 0 and
    // the vine then takes about four seconds to grow, so without this the first
    // word would sit red and underlined under an empty patch of screen and
    // the rotation would be a word or two along by the time the bee faded up.
    if (!beeReady) i = -1;
    for (var j = 0; j < buttons.length; j++)
      buttons[j].setAttribute("aria-current", j === i ? "true" : "false");
  }

  // A leg is only re-aimed when the destination actually changes, because this
  // is also where depth is decided -- once, from the direction of travel, and
  // then held for the whole crossing. Deciding it per frame instead would let
  // the bee change planes halfway through the vine, which reads as a glitch
  // rather than as depth.
  function retarget(force) {
    var i = active();
    if (i === legIndex && !force) return;
    legIndex = i;
    target = aimAt(i);
    legFace = target.face;
    var dx = target.x - x;
    if (Math.abs(dx) > 24) {
      host.style.zIndex = dx > 0 ? Z_FRONT : Z_BEHIND;
    }
    arrived = false;
    eatT = reaimT = 0;   // the meal is over; both clocks start again on arrival
    lit(-1);          // and the label it was feeding at lets go
  }

  /* ---- motion ----------------------------------------------------------- */

  // A critically damped spring, not a tween and not a plain exponential chase.
  // A tween has to be torn down and restarted when a hover interrupts it, and
  // the restart shows as a kink; an exponential chase is smooth but starts every
  // leg at full speed, so the bee leaves like it was flicked. The spring carries
  // its velocity across a change of target, so an interrupt mid-flight becomes a
  // bank and not a corner, and it accelerates out of a standstill on its own.
  function integrate(dt) {
    var ax = OMEGA * OMEGA * (target.x - x) - 2 * OMEGA * vx;
    var ay = OMEGA * OMEGA * (target.y - y) - 2 * OMEGA * vy;
    vx += ax * dt; vy += ay * dt;
    x += vx * dt;  y += vy * dt;
  }

  function step(dt) {
    retarget(false);
    integrate(dt);

    var dx = target.x - x, dy = target.y - y;
    var speed = Math.sqrt(vx * vx + vy * vy);
    if (!arrived && Math.sqrt(dx * dx + dy * dy) < ARRIVE && speed < CALM) {
      arrived = true;
      dwell = DWELL;
      eatT = 0;
      lit(legIndex);
    }
    if (arrived) {
      eatT += dt;
      // The vine goes on swaying while the bee eats, so the aim is re-taken at
      // the cadence the grid is re-read and the spring walks the difference. It
      // is the same measurement, not a second mechanism: the bee holds station
      // against a strand that is moving, which is what feeding looks like.
      reaimT += dt;
      if (reaimT >= VINE_SAMPLE) {
        reaimT = 0;
        var re = aimAt(legIndex);
        target.x = re.x; target.y = re.y;
      }
    }
    // The swell. Linear in and out rather than eased, because it is already
    // being watched through a fade -- the halo it drives widens as a blur and a
    // blur softens its own ends. An ease here would land as a hesitation.
    feed += ((arrived && beeReady) ? 1 / FEED_IN : -1 / FEED_OUT) * dt;
    feed = feed < 0 ? 0 : feed > 1 ? 1 : feed;

    // the dwell clock only runs unattended: while the pointer is on a button the
    // bee stays put, however long that is
    // ...and it does not run before the bee is on screen either: the rotation
    // is the bee's tour of the list, so its first step is timed from the bee's
    // first landing, not from page load.
    if (arrived && hoverIndex < 0 && beeReady) {
      dwell -= dt;
      if (dwell <= 0) { autoIndex = nextDown(autoIndex); retarget(false); }
    }

    // Turning off the spring's own velocity, which is already smooth, so no
    // extra filtering is needed -- just a deadband, or the bee would flicker
    // between facings on the sub-pixel drift of the hover bob.
    if (vx > TURN) facing = "right";
    else if (vx < -TURN) facing = "left";
    // ...and the arrival overrules it: parked, the bee faces the plant whatever
    // it was doing on the way in. The two never fight over it, because a bee at
    // a standstill is inside the deadband and the rule above has no opinion.
    if (arrived) facing = legFace;

    flapT += dt;
    while (flapT >= FLAP) { flapT -= FLAP; frame = (frame + 1) % total; }
  }

  /* ---- drawing ---------------------------------------------------------- */

  function draw() {
    var key = facing + frame;
    if (key !== drawn) {
      drawn = key;
      var f = FRAMES[facing][frame];
      for (var L = 0; L < pres.length; L++) pres[L].textContent = f[L];
    }
    // The bob is added here and never integrated into x/y, so the hover wobble
    // rides on the flight instead of fighting the spring for the same variable.
    // Two periods that do not divide into each other, for the reason the vine
    // uses two: a single sine settles into a beat the eye picks up in seconds.
    // The nibble rides here too, and is the only one of the three that is not a
    // plain sine: a raised cosine off eatT, which leaves 0 on the exact frame
    // the bee settles -- so there is no step into it -- and which only ever
    // lunges TOWARD the plant, never away from it. Hence eatT and not clock:
    // the free-running clock would be caught mid-swing at every arrival.
    var nib = arrived ? NIB_A * (0.5 - 0.5 * Math.cos(eatT * TAU / NIB_P)) : 0;
    var bx = x + SWAY_A * Math.sin(clock * TAU / SWAY_P) +
             (legFace === "right" ? nib : -nib);
    var by = y + BOB_A * Math.sin(clock * TAU / BOB_P);
    host.style.transform = "translate3d(" + (bx - halfW).toFixed(2) + "px," +
                                            (by - halfH).toFixed(2) + "px,0)";

    // The halo, quantised to thirteen steps. The swell is only moving for about
    // half a second at each end of a meal; between those it holds, and a
    // quantised value means the style is not written at all while it holds. Five
    // filter strings a frame for no change would be five compositor invalidations
    // a frame for no change.
    var q = Math.round(feed * 12);
    if (q !== glowShown) {
      glowShown = q;
      var add = GLOW_ADD * (q / 12);
      for (var B = 0; B < BANDS.length; B++)
        if (BANDS[B].halo) pres[B].style.filter = haloFilter(BANDS[B].halo, add);
    }

    // The nose, in viewport coordinates -- taken from bx and not from x, so it
    // carries the lunge and the hover with it. This is the bite: where the vine
    // lights.
    var nose = bx + (legFace === "right" ? halfW + EAT_GAP : -(halfW + EAT_GAP));

    // The one thing the bee ever says to the vine, and it says it by leaving a
    // plain object on the window rather than by calling anything. Nothing is
    // read back, no function is shared, and the vine re-validates every field
    // before it uses one -- so the isolation the two scripts were written with
    // survives: a bee that throws, stalls or writes rubbish here still cannot
    // stop the plant from growing. See readBite() in the other script.
    window.BEE_BITE = feed > 0
      ? { x: nose, y: by, r: BLOOM_R, amp: BLOOM_AMP * feed }
      : null;
  }

  function tick(now) {
    if (!last) last = now;
    // clamped so a tab returning from the background integrates one ordinary
    // frame rather than a minute's worth, which would fire the bee off-screen
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    clock += dt;
    step(dt);
    draw();
    requestAnimationFrame(tick);
  }

  /* ---- pointer ---------------------------------------------------------- */

  // The zone is the GROUP, not the button: one of these words has a menu under
  // it, and a pointer that has moved down into that menu has not left the word
  // -- it is reading what the word opened. The bee stays, the dwell clock stays
  // stopped, and the label stays lit, which is the whole of what makes the
  // dropdown feel like part of the word rather than a panel in front of it.
  //
  // over/out rather than enter/leave, because those do not bubble and the
  // things being moved onto here are the menu's own children. The relatedTarget
  // test is what turns a bubbling out into a real leave: moving from the word to
  // an item inside its menu fires one, and it is not one.
  buttons.forEach(function (b, i) {
    var zone = b.closest(".drop") || b;
    zone.addEventListener("mouseover", function () {
      if (hoverIndex === i) return;
      hoverIndex = i;
      retarget(false);          // breaks off whatever leg was in progress
    });
    zone.addEventListener("mouseout", function (e) {
      if (hoverIndex !== i) return;
      if (e.relatedTarget && zone.contains(e.relatedTarget)) return;   // still inside
      hoverIndex = -1;
      // resume the rotation FROM HERE rather than from wherever it had got to,
      // so the next button is the one after the one just visited
      autoIndex = i;
      if (arrived) dwell = DWELL;
    });
  });

  window.addEventListener("resize", function () {
    halfW = host.offsetWidth / 2;
    halfH = host.offsetHeight / 2;
    forgetRects();              // every box on the page has just moved
    retarget(true);             // the nav has moved; re-read the rects
  });

  /* ---- start ------------------------------------------------------------ */

  function start() {
    // Monospace advance width varies by font, so measure it rather than assuming
    // 0.6em -- the vine measures it for the same reason. The vine then squares
    // its cells to 2:1 because that is the aspect its source grid was baked at;
    // a hand-drawn sprite wants SQUARE cells instead, or six rows of bee would
    // be twice as tall as it is wide and there would be no room to draw a waist.
    var probe = document.createElement("canvas").getContext("2d");
    var style = getComputedStyle(pres[0]);
    probe.font = style.fontWeight + " 100px " + style.fontFamily;
    var w = probe.measureText("MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM").width;
    var advance = w > 0 ? w / 40 / 100 : 0.6;
    pres.forEach(function (p) { p.style.lineHeight = advance + "em"; });

    // one draw to give the element a size before anything is measured against it
    var f0 = FRAMES.right[0];
    for (var L = 0; L < pres.length; L++) pres[L].textContent = f0[L];
    halfW = host.offsetWidth / 2;
    halfH = host.offsetHeight / 2;

    // the top word, wherever the layout has put it
    autoIndex = byHeight()[0];
    var first = aimAt(autoIndex);
    x = first.x; y = first.y;
    target = first;
    legFace = facing = first.face;
    legIndex = autoIndex;
    arrived = true;
    dwell = DWELL;
    // start() parks the bee at the first button without ever passing through
    // step(), so the label it is already feeding at has to be lit from here
    lit(autoIndex);
    host.style.zIndex = Z_FRONT;
    draw();

    // The bee comes in behind the last word, not behind the whole growth. The
    // nav fades itself in at the pace the vine descends past it and stamps #gaze
    // with `grown` on the last one, so that class is the cue: the list finishes
    // writing itself and the bee arrives to it, while the plant is still filling
    // out underneath. Waiting for the growth's full length instead left a few
    // seconds of finished list and nothing in it.
    //
    // Polled off the class rather than taken off an event, for the same reason
    // the vine's own `ready` is polled: this runs after fonts.ready and the nav
    // may well have finished first, and a class that is already set still reads
    // true where an event already fired is simply gone.
    //
    // The cap is a backstop on the whole opening, the nav's own included -- it
    // cannot be allowed to keep the bee off the page if it never marks itself.
    var gaze = document.getElementById("gaze");
    var plantData = window.ASCII_PLANT;
    var CAP = (plantData ? (150 / plantData.fps) * 1000 : 4000) + 1200;
    var waitedFrom = performance.now();

    (function waitForLabels() {
      if (!(gaze && gaze.classList.contains("grown")) &&
          performance.now() - waitedFrom < CAP)
        return void requestAnimationFrame(waitForLabels);

      // a beat behind the mark, so the bee's half-second fade sits under the tail
      // of the last word's rather than racing it
      setTimeout(function () {
        host.classList.add("ready");
        // Only now is there a bee to see, so only now is there anything to
        // light: the swell is held at zero until this, or the vine would come
        // out of its growth already blooming under an invisible bee.
        beeReady = true;
        forgetRects();      // the nav finished writing itself while we waited
        // The opening aim was taken before the vine had drawn a single frame, so
        // inkEdge() had nothing to measure and it fell back to the box. Now
        // there is ink: re-take it, and let the spring walk the bee the last
        // few pixels in while it fades up.
        retarget(true);
      }, 250);
    })();

    requestAnimationFrame(tick);
  }

  // the same wait the vine makes, for the same face -- see the end of its script
  if (document.fonts && document.fonts.load)
    document.fonts.load('10px "MisketRamp"', " \u00b7.\u2219\u2022\u25cb\u25cf\u25a0M")
      .catch(function () {})
      .then(function () { return document.fonts.ready; })
      .then(start);
  else start();
})();
</script>
<script>
/* ---- the labels --------------------------------------------------------
   The nav comes in with the growth: a word lights up when the vine has grown
   past the height that word sits at, so the list writes itself down the page
   at the plant's own pace instead of sitting there complete while the plant is
   still a stub.

   Its own IIFE, and it reads the vine the way the bee does -- off the rendered
   <pre>s, never off the vine's clock or its frame number. The growth is a clip
   with a frame rate and the labels are four boxes with percentage tops, and the
   only thing that reliably relates them is where the ink actually IS. A
   schedule derived from the frame count would be a second copy of the timing,
   correct until the clip is re-baked or the window changes shape.

   The two dimmest bands are skipped for the reason the bee skips them: their
   outlying cells are ones you cannot see, and a word should not answer to a
   tip that has not visibly arrived. */
(function () {
  "use strict";

  var SAMPLE = 80;      // ms between reads; the growth is 24fps, this is plenty

  var stack = document.getElementById("stack");
  var layers = [].slice.call(document.querySelectorAll("#stack pre")).slice(2);
  var pending = [].slice.call(document.querySelectorAll("#gaze button"));
  var rows = 0, at = -1e9;

  // Boxes, measured once. This loop runs through the growth, which is the one
  // stretch of the page where the vine is repainting a full grid every frame --
  // so a getBoundingClientRect in here does not read a box, it forces the whole
  // grid to be laid out again before it can answer. Nothing being measured
  // moves: #stack is pinned by buildGrid, the buttons are placed off it in
  // percentages, and a word being revealed only changes its opacity.
  var stackRect = null, btnRects = [];
  function stackBox() {
    if (!stackRect || !stackRect.height) stackRect = stack.getBoundingClientRect();
    return stackRect;
  }
  // Keyed off `all` and not off `pending`: pending is spliced as each word
  // reveals itself, so its indices move under you and a cache keyed on them
  // would start handing out the wrong box halfway through the growth.
  var all = pending.slice();
  function btnBox(b) {
    var i = all.indexOf(b), r = btnRects[i];
    if (!r || !r.height) r = btnRects[i] = b.getBoundingClientRect();
    return r;
  }

  // The nav marks itself done on the last word. That mark is the bee's cue --
  // it waits on this class, not on the growth's length -- so the list being
  // complete and the bee arriving are one event with one cause, and re-timing
  // the reveal re-times the entrance for free.
  var gaze = document.getElementById("gaze");
  function reveal(b) {
    b.classList.add("grown");
    var i = pending.indexOf(b);
    if (i >= 0) pending.splice(i, 1);
    if (!pending.length) gaze.classList.add("grown");
  }

  // The backstop. The vine's tip need not reach the lowest label -- the grid is
  // taller than the plant in it -- and with no payload at all there is no ink to
  // pass anything. Either way the list has to be there when the growth is over,
  // so the clip's own length decides the last word, whatever the ink did.
  var plant = window.ASCII_PLANT;
  setTimeout(function () {
    while (pending.length) reveal(pending[pending.length - 1]);
  }, (plant ? (150 / plant.fps) * 1000 : 4000) + 600);

  // the grid is rebuilt on resize, so the row count is re-read rather than kept
  window.addEventListener("resize", function () {
    rows = 0; stackRect = null; btnRects = [];
  });

  // How far down the page the growth has got, in px: the lowest row that has any
  // ink in it, in the vine's own box. trimming the tail off the text is the
  // whole measurement -- rows below the tip are spaces and newlines and nothing
  // else, so what survives the trim ends on the last row that has something in
  // it, and counting its newlines is that row's index.
  // The lowest row with any ink in it, counted from the BACK of the text.
  //
  // This used to be a `.replace(/\s+$/, "")` and a `.split("\n")` per layer,
  // eight times a second, over eleven thousand characters that are mostly the
  // empty grid below the tip -- two full passes and two big allocations to find
  // one number, on the main thread, during the only part of this page that is
  // already painting a fresh grid every frame. Walking backwards over the tail
  // instead touches only the whitespace it is there to skip, allocates nothing,
  // and gets the row by subtraction: the grid has rows-1 newlines in it (the
  // last line carries none), so the newlines counted on the way back are the
  // rows BELOW the ink, and the rest are above it.
  function lastInkRow(t) {
    var i = t.length - 1, below = 0, c;
    while (i >= 0) {
      c = t.charCodeAt(i);
      if (c === 10) below++;
      else if (c !== 32 && c !== 9 && c !== 13) break;
      i--;
    }
    return i < 0 ? -1 : (rows - 1) - below;
  }

  function front() {
    if (!layers.length) return null;
    if (!rows) {
      // The grid's own stamp when it is there, and the newline count when it is
      // not -- the vine writes the stamp in buildGrid, which has run before this
      // loop starts, but a page with no payload never gets that far.
      rows = +stack.dataset.rows;
      if (!(rows > 0)) {
        var full = layers[0].textContent;
        if (!full) return null;
        rows = full.split("\n").length;
      }
    }
    var row = -1;
    for (var i = 0; i < layers.length; i++) {
      var n = lastInkRow(layers[i].textContent);
      if (n > row) row = n;
    }
    if (row < 0) return null;
    var r = stackBox();
    if (!r.height) return null;
    return r.top + (row + 1) * (r.height / rows);
  }

  function tick(now) {
    if (!pending.length) return;      // nothing left to wait for; stop the loop
    if (now - at >= SAMPLE) {
      at = now;
      var y = front();
      if (y !== null) {
        for (var i = pending.length - 1; i >= 0; i--) {
          var b = btnBox(pending[i]);
          // the middle of the word, not its top: the fade should read as the
          // growth passing THROUGH it
          if (b.top + b.height / 2 <= y) reveal(pending[i]);
        }
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>

<script>
/* ---- the dropdown -------------------------------------------------------
   Hover opens it, click pins it open, and the difference is the whole of the
   logic here. A pointer passing over a word should be able to see what is
   under it and then leave without having changed anything; a pointer that
   CLICKED the word has asked for the list to stay, and it then stays until it
   is dismissed -- another click, a click elsewhere, or Escape.

   It is not a CSS :hover, and the reason is that a click cannot close what
   :hover is holding open: the pointer is still on the word, so the rule that
   opened it is still matching, and the menu would snap back the moment the
   class came off. One state, in one place, driven by both inputs.

   The bee opens it too: while it is feeding at PROJECTS the list is out, and
   it rolls back up when the bee moves on. Three reasons to be open -- the
   pointer on the group, a click pin, the bee -- and the menu is open while any
   of them holds. The bee's is read off the aria-current the bee script stamps
   on the word it has landed at, so neither script reaches into the other.
   Dismissing (a click, a click elsewhere, Escape) clears all three, so a list
   shut while the bee is still there stays shut until it lands here again.

   The pointer's reason is mouse only, which is the point of pointerType: touch
   has no hover, and its first tap is the pin.

   pointerover/pointerout rather than enter/leave, because those bubble: the
   listener sits on the wrapper, which is pointer-events:none like the rest of
   #gaze, and only ever hears from the button and the items underneath it. The
   relatedTarget check is what turns a bubbling out into a real leave -- moving
   from the button to an item inside the menu fires one, and it is not one. */
(function () {
  "use strict";

  var drop = document.querySelector("#gaze .drop");
  if (!drop) return;
  var btn = drop.querySelector("button");
  var hover = false, pinned = false, bee = false;

  function sync() {
    var open = hover || pinned || bee;
    drop.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  function set(open) {
    if (open) hover = true;
    else hover = pinned = bee = false;
    sync();
  }

  // Closed until the growth has reached the word. The button is unhoverable
  // before then anyway -- pointer-events arrives with `grown` -- but the menu
  // must not be openable by a click that lands on the word's dark box either.
  function ready() { return btn.classList.contains("grown"); }

  drop.addEventListener("pointerover", function (e) {
    if (e.pointerType === "mouse" && ready()) set(true);
  });
  drop.addEventListener("pointerout", function (e) {
    if (e.pointerType !== "mouse" || pinned) return;
    if (e.relatedTarget && drop.contains(e.relatedTarget)) return;   // still inside
    hover = false;
    sync();                     // the bee may still be holding it open
  });

  new MutationObserver(function () {
    var landed = btn.getAttribute("aria-current") === "true";
    if (landed === bee) return;
    bee = landed && ready();
    sync();
  }).observe(btn, { attributes: true, attributeFilter: ["aria-current"] });

  btn.addEventListener("click", function (e) {
    e.preventDefault();
    if (!ready()) return;
    // Touch never hovered, so the first tap is the one that opens. On a mouse
    // the menu is already open by the time the click lands, and the click is
    // therefore either a pin or a dismissal.
    if (drop.classList.contains("open") && pinned) set(false);
    else { pinned = true; sync(); }
  });

  // A chosen item has answered the question the menu was asking.
  drop.addEventListener("click", function (e) {
    if (e.target.closest(".item")) set(false);
  });

  // pointerdown, not click: iOS Safari only fires click on things it thinks
  // are clickable, so a tap on the vine or the black never reached here and
  // the menu stayed open on a phone. pointerdown fires for every tap and press.
  document.addEventListener("pointerdown", function (e) {
    if (!drop.contains(e.target)) set(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && drop.classList.contains("open")) { set(false); btn.focus(); }
  });
})();
</script>

<script>
/* ---- where the words go -------------------------------------------------
   The destination lives on the word, as data-href, and this is the one
   listener that honours it. PROJECTS has none and never will: it answers a
   click by unrolling its list, and the script above owns that.

   These stay <button>s and do not become <a>s, which looks like the obvious
   simplification and is not. `#gaze button` is the selector the bee's flight
   path and the growth's reveal are both built on -- four buttons, four rects
   read every frame, four words lit in turn -- and an <a> would drop out of
   both: the bee would stop visiting the word and the growth would never hand
   it `grown`, which is also what gives it pointer-events. So the anchor's one
   useful property is borrowed here instead, and the element stays what the
   rest of the page already believes it is.

   No guard on `grown` is needed: an ungrown button is pointer-events:none, so
   a click on it never reaches this listener at all. */
(function () {
  "use strict";

  document.getElementById("gaze").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-href]");
    if (btn) location.href = btn.dataset.href;
  });
})();
</script>

</body>
