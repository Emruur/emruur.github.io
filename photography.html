    else if (!running) { running = true; last = 0; requestAnimationFrame(frame); }
  });

  // The full-screen view parks it too, from its own script -- panning behind an
  // opaque overlay is work nobody can see.
  window.__pause = function (on) {
    if (on) { running = false; }
    else if (!running) { running = true; last = 0; requestAnimationFrame(frame); }
  };
  window.__cats = cats;
  // The reader itself, and the switch for who it answers to. The focused view
  // has no wheel listener of the wall's to inherit -- #full is a sibling of
  // #viewport, not a child, so a swipe over the overlay never reaches the one
  // below -- and needs both halves: this to read the gesture, and its own
  // listener to feed it.
  window.__sideways = sideways;
  window.__sidewaysTo = function (fn) { hTo = fn; hReset(); };

  /* ---- start ------------------------------------------------------------ */

  build();
  layout();
  // Open on the first category, at its first row. There is no world origin to
  // open at any more -- the origin IS the first category's first row.
  /* ---- ?debug -----------------------------------------------------------
     Two sliders for the two ends of the gutter ramp, because the gutter is the
     one grid number that is a judgement rather than a derivation -- 12px and
     35px are both defensible and look nothing alike, and neither is reachable
     by arithmetic from anything else on the page.

     Two and not one because the whole point of the ramp is that the right
     answer differs at the ends, so a single slider would be dialling a number
     that does not exist. The readout shows what THIS window is actually
     getting, which is the interpolation between them.

     It writes the same vars layout() already reads every pass, so there is no
     second source of truth: relayout() recomputes precisely what a window
     resize would. Nothing persists, deliberately -- the numbers live in
     layout.py and this only finds them.

     Gated on the query string, so for a real visitor the whole block is one
     regex and nothing else. */
  if (/[?&]debug\b/.test(location.search)) {
    var dbg = document.createElement("div");
    dbg.id = "debug";
    dbg.style.cssText =
      "position:fixed;right:14px;bottom:14px;z-index:90;background:#000;" +
      "border:1px solid var(--ink-0);padding:9px 11px 8px;color:var(--ink-2);" +
      "font:20px/1.35 VT323,monospace;pointer-events:auto;width:250px";
    dbg.innerHTML =
      '<div style="color:var(--ink-1)">gutter at <b id="dbgnow" ' +
      'style="color:var(--accent);font-weight:400"></b></div>' +
      '<label style="display:block;margin-top:7px;color:var(--ink-1)">narrow ' +
      '<b id="dbgnv" style="color:var(--ink-3);font-weight:400"></b>px' +
      '<input id="dbgn" type="range" min="0" max="60" step="1" ' +
      'style="width:100%;margin:2px 0 0;accent-color:var(--accent)"></label>' +
      '<label style="display:block;margin-top:4px;color:var(--ink-1)">wide ' +
      '<b id="dbgwv" style="color:var(--ink-3);font-weight:400"></b>px' +
      '<input id="dbgw" type="range" min="0" max="60" step="1" ' +
      'style="width:100%;margin:2px 0 0;accent-color:var(--accent)"></label>' +
      '<div id="dbgc" style="color:var(--ink-0);font-size:18px;margin-top:5px"></div>';
    document.body.appendChild(dbg);
    var $n = dbg.querySelector("#dbgn"), $w = dbg.querySelector("#dbgw");
    var $nv = dbg.querySelector("#dbgnv"), $wv = dbg.querySelector("#dbgwv");
    var $now = dbg.querySelector("#dbgnow"), $c = dbg.querySelector("#dbgc");
    var dbgShow = function () {
      $nv.textContent = GUT_N;
      $wv.textContent = GUT_W;
      $now.textContent = GUT + "px  (" + vw + "px wide)";
      // What the gutter costs, which is the number worth watching: on a grid of
      // fixed-width columns it comes straight out of the picture.
      var cols = vw <= NARROW ? COLS_N : COLS;
      var cw = Math.min(MAXW, Math.max(1, vw - PAD * 2));
      $c.textContent = cols + " cols  " +
        Math.round((cw - (cols - 1) * GUT) / cols) + "px wide  ->  layout.py";
    };
    var dbgSet = function () {
      GUT_N = +$n.value;
      GUT_W = +$w.value;
      relayout();
      dbgShow();
    };
    $n.value = GUT_N;
    $w.value = GUT_W;
    dbgShow();
    $n.addEventListener("input", dbgSet);
    $w.addEventListener("input", dbgSet);
    // The wall is draggable everywhere; the panel must not pan it.
    dbg.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    dbg.addEventListener("wheel", function (e) { e.stopPropagation(); },
                         { passive: true });
    window.addEventListener("resize", function () { setTimeout(dbgShow, 60); });
  }

  goTo(0, true);
  document.body.classList.add("ready");
  requestAnimationFrame(frame);

  // The fonts the nav is set in change its height, and TOP comes off that
  // height. Without this the wall sits where a fallback font put the bar and
  // stays there, which is a few pixels on this page and a visible step on a
  // slow connection.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(relayout);
  }
})();
</script>

<script>
(function () {
  "use strict";

  /* ---- one photograph, at the size it was taken for --------------------
     The wall is a way of finding a photograph; this is the only place on the
     page where you are actually looking at one. It sits over the world rather
     than replacing it -- the world keeps its scroll position, its loaded
     pictures and its place in the tour, and gets them back untouched.

     Left and right step through the category IN ITS OWN ORDER, and that is the
     whole return on the layout having respected that order in the first place.
     Everything else here could have been built on an unordered pile. */

  var full  = document.getElementById("full");
  var stage = full.querySelector(".stage");
  var meta  = full.querySelector(".meta");
  var L     = window.PHOTO_LAYOUT;

  /* The three plates, by the job each is doing rather than by where it sits in
     the markup -- because the jobs move and the elements do not. A swipe
     RENAMES them: the plate that was on the right becomes the middle one, the
     middle one becomes the left one, and the one that fell off the back is
     recycled as the new far side.

     That is the whole reason this is a rotation and not a repaint. Repainting
     the middle plate with the next photograph would hand a fresh src to an
     <img> whose file is already decoded and on screen, and the fade from the
     placeholder would run again -- a photograph you have been looking at for
     300ms going soft and sharpening again at the end of the swipe. Moving the
     name instead touches nothing the browser has already done. */
  var slot = {
    before: full.querySelector(".plate.before"),
    main:   full.querySelector(".plate.main"),
    after:  full.querySelector(".plate.after")
  };

  var cur = null, from = null, keyed = false;

  /* ---- the swipe, and the ceiling on it --------------------------------
     The arrows are the mouse's answer and the arrow keys are the keyboard's.
     Neither is what a hand reaches for. A hand asks for the next photograph by
     pushing this one aside, and it has two ways of saying so:

       - ON GLASS, a finger on the photograph. Pointer events, below.
       - ON A TRACKPAD, two fingers sideways. That is not a drag at all -- it
         arrives as wheel deltaX, the browser's own back-navigation gesture,
         and it comes with a momentum tail that goes on reporting for the best
         part of a second after the fingers have lifted. The wall solved that
         once already and the solution is the hardest thing in this file, so
         this borrows it rather than repeating it: window.__sideways reads the
         gesture and __sidewaysTo says the answer comes here while the view is
         open. See the long comment over sideways() in the other script.

     A mouse drag is deliberately NOT one of them. A mouse has the arrows, the
     keys, and a click on the ground to leave by, and making the ground draggable
     as well only puts a way to mis-fire on top of a way to leave.

     Every number here exists to hold the gesture DOWN. A wall is a place you
     can be thrown across -- it has 125 pictures in it and momentum is how you
     cover them. One photograph at the size of the window is the opposite: it
     is a place you have arrived at, and a flick that carried you four deep
     would be the view losing the thing you opened it for. So:

       - the plate never travels further than SW_MAX, however hard it is
         pulled -- the rubber approaches that asymptotically, so there is no
         corner in the feel where a clamp bites;
       - the gesture is decided ON RELEASE and spends itself once. There is no
         velocity left running when the finger lifts, which means no way for
         one throw to page twice;
       - what follows is a fixed slide of SW_OUT px, not a decaying flick. The
         speed of the throw chooses the direction and nothing else.

     The wall's flick math (hEnv, hPeak, PAGE_TURNS, all of it) exists because
     a trackpad's inertia tail keeps reporting after the fingers are up and
     something has to tell a new push from an old one's echo. A touch drag
     under pointer capture has none of that: pointerup is the end of it. */

  var SW_FREE  = 70;    // px the plate follows the finger one for one
  var SW_MAX   = 130;   // px it can reach at all -- the rubber's asymptote
  var SW_TRIP  = 64;    // px of travel on release that means "the next one"
  var SW_FLICK = 0.5;   // px/ms that means it without the distance
  var SW_SLOP  = 8;     // px of travel under which the gesture was a tap
  var SW_WIN   = 80;    // ms of pointer history the flick's speed comes from
  var SW_SLIDE = 340;   // ms of the slide to the neighbouring photograph
  var SW_BACK  = 260;   // ms of the spring back when it was not enough
  var SW_EASE  = "cubic-bezier(.22, 1, .36, 1)";  // the page's one curve

  function tier(rec) {
    // The plate is sized by the window, not by the box on the wall, so that is
    // what the file has to cover. Same DPR cap as the grid.
    //
    // The SMALLEST tier that covers it, and the largest available when none
    // does. Written the other way round -- the largest tier at or below what is
    // wanted -- it served the 760px file into a 1290px plate on every window
    // narrower than about 1650px, which is most of them, and the result looked
    // exactly like a page that had failed to load the big one.
    var want = window.innerWidth * 0.92 * Math.min(window.devicePixelRatio || 1, 2);
    var have = rec.t[rec.t.length - 1];
    for (var i = rec.t.length - 1; i >= 0; i--) if (rec.t[i] >= want) have = rec.t[i];
    return "photos/w" + have + "/" + rec.f + ".webp";
  }

  // Which photograph is on a plate is the plate's own business, so it holds on
  // to it: a plate already showing this one is left completely alone. That
  // guard is not an optimisation, it is the thing that stops a neighbour being
  // re-decoded at the exact moment it becomes the photograph you are looking at.
  function dress(el, rec) {
    var im = el.querySelector("img");
    if (!rec) {
      // Only ever a category of one, and then there is nothing either side.
      el.hidden = true;
      el.__rec = null;
      im.removeAttribute("src");
      return;
    }
    el.hidden = false;
    if (el.__rec === rec) return;
    el.__rec = rec;
    var cat = L.cats[rec.cat];
    el.style.backgroundImage = "url(data:image/webp;base64," + rec.q + ")";
    // The ratio goes on the PLATE and not on the image, or the placeholder
    // behind a picture that has not landed yet is the wrong shape -- which is
    // worse than no placeholder at all, because it moves when the picture
    // arrives. The box is right before there is anything in it.
    // The aspect comes off the payload and not off the box on the wall. They
    // agree -- the box IS one column wide by column/ar tall -- but the box is a
    // rounded integer and rounding a 495px width through a 2.845 panorama is a
    // pixel of error in the plate's shape, which at full screen is a visible
    // seam of background down one edge.
    el.style.setProperty("--ar", rec.ar);
    im.classList.remove("in");
    im.onload = function () { this.classList.add("in"); };
    im.src = tier(rec);
    im.alt = cat.label + ", photograph " + rec.n;
  }

  function label(rec) {
    var cat = L.cats[rec.cat];
    meta.innerHTML = cat.label + " &#183; <b>" +
      (rec.n < 10 ? "00" : rec.n < 100 ? "0" : "") + rec.n +
      "</b> / " + cat.items.length;
  }

  // Wraps. A category is a body of work and not a list with two ends -- and
  // the alternative is an arrow that is sometimes dead, which reads as the page
  // having stopped responding rather than as the work having run out.
  function beside(rec, d) {
    var mine = window.__cats[rec.cat].items;
    if (mine.length < 2) return null;
    var i = mine.indexOf(rec);
    return mine[(i + d + mine.length) % mine.length];
  }

  // Everything, from cold. The two neighbours are fetched with the middle one
  // rather than on demand, and that is a deliberate three-for-one: the swipe
  // has to be able to show the next photograph AT THE MOMENT the finger starts
  // moving, and a request made then would arrive long after the gesture is
  // over. It costs two extra files on the way in and nothing after that --
  // every swipe from here on pulls exactly one, the far side of the new
  // neighbour, which is the same one photograph a swipe would have pulled
  // anyway.
  function paint(rec) {
    cur = rec;
    dress(slot.main, rec);
    dress(slot.before, beside(rec, -1));
    dress(slot.after, beside(rec, 1));
    label(rec);
  }

  // The rename. Nothing is loaded, moved or faded here except the plate that
  // fell off the back, which is the only one whose photograph is genuinely new.
  function rotate(d) {
    var to = beside(cur, d);
    if (!to) return;
    var recycled = d > 0 ? slot.before : slot.after;
    if (d > 0) { slot.before = slot.main; slot.main = slot.after;  slot.after  = recycled; }
    else       { slot.after  = slot.main; slot.main = slot.before; slot.before = recycled; }
    cur = to;
    slot.before.className = "plate side before";
    slot.main.className   = "plate main";
    slot.after.className  = "plate side after";
    dress(recycled, beside(cur, d));
    label(cur);
  }

  // What the arrows and the arrow keys do: the same rename, without the slide.
  function step(d) {
    if (!cur) return;
    if (busy) settle();
    rotate(d);
  }

  /* ---- the gesture ------------------------------------------------------ */

  var sid = null, sx0 = 0, sy0 = 0, sdx = 0, sdy = 0, smoved = 0;
  var shist = [], busy = false, pend = 0, tSlide = 0, ate = false;

  /* Moving and fading are ONE operation, and that is the whole idea: the plate
     leaving goes black in proportion to how far it has gone, and the one
     arriving comes up in proportion to how far it has come. Not a slide with a
     crossfade laid over it -- the fade IS the distance, expressed twice.

     Which is also why the drag barely fades anything. A held drag is capped at
     130px of a journey that is a whole photograph wide, so it spends about a
     tenth of the fade: the picture dips slightly, the dark beside it stays
     dark, and nothing of the next photograph is given away until the gesture
     is actually committed to. */
  function place(x) {
    stage.style.transform = x ? "translate3d(" + x + "px,0,0)" : "";
    var t = x ? Math.min(1, Math.abs(x) / (x < 0 ? rFwd : rBack)) : 0;
    slot.main.style.opacity = 1 - t;
    slot.after.style.opacity = x < 0 ? t : 0;
    slot.before.style.opacity = x > 0 ? t : 0;
  }

  // At rest there is nothing to say: the classes carry it, and rotate() has
  // just moved the classes onto the right elements.
  function bare() {
    slot.main.style.opacity = "";
    slot.before.style.opacity = "";
    slot.after.style.opacity = "";
  }

  function ease(ms) {
    stage.style.transition = ms ? "transform " + ms + "ms " + SW_EASE : "none";
    var o = ms ? "opacity " + ms + "ms " + SW_EASE : "none";
    slot.before.style.transition = o;
    slot.main.style.transition = o;
    slot.after.style.transition = o;
  }

  // Both reaches, once per gesture. place() is called on every pointermove and
  // reading a rect there would force a layout against the transform it has
  // just written, sixty times a second, for a number that cannot change while
  // a finger is down.
  var rFwd = 1, rBack = 1;
  function measure() {
    rFwd = Math.abs(reach(1)) || 1;
    rBack = Math.abs(reach(-1)) || 1;
  }

  // How far the stage has to travel for the neighbour to be standing where the
  // middle plate is now. MEASURED rather than computed: it is the distance
  // between two centres, the plates are different widths because photographs
  // are different shapes, and the gutter between them is a clamp() in the
  // stylesheet. Reading it back off the layout is both shorter than working it
  // out and correct on a window size nobody thought about.
  function reach(d) {
    var a = slot.main.getBoundingClientRect();
    var b = (d > 0 ? slot.after : slot.before).getBoundingClientRect();
    return (b.left + b.width / 2) - (a.left + a.width / 2);
  }

  // Past SW_FREE the finger buys less and less of what it is pulling, and
  // never more than SW_MAX of it in total. Exponential rather than the wall's
  // linear RUBBER because this one has a ceiling to approach: a constant
  // fraction of an unbounded drag is still unbounded.
  function hold(d) {
    var a = Math.abs(d);
    if (a <= SW_FREE) return d;
    var give = (SW_MAX - SW_FREE) * (1 - Math.exp(-(a - SW_FREE) / (SW_MAX - SW_FREE)));
    return (d < 0 ? -1 : 1) * (SW_FREE + give);
  }

  /* The end of a slide, and the one thing in here that has to be exactly
     right. At this moment the stage is parked one whole photograph off centre
     with the arriving one sitting in the middle of the window. The rename puts
     that plate's name to `main` and the transform comes off in the SAME
     synchronous block -- the stage re-centres on its new middle plate by
     exactly the distance it had been pushed, so the two cancel and not one
     pixel moves. Split them across a frame and the photograph jumps a
     window's width and back.

     `pend` is the rename the slide owes: if anything cuts the slide short --
     a second swipe, the view closing -- it still happens, or the gesture is
     eaten and the page reads as having ignored a swipe it visibly accepted. */
  function settle() {
    clearTimeout(tSlide);
    var d = pend; pend = 0;
    ease(0);
    if (d) rotate(d);
    place(0);
    bare();
    stage.style.transition = "";
    slot.before.style.transition = "";
    slot.main.style.transition = "";
    slot.after.style.transition = "";
    busy = false;
  }

  // One movement now, in the direction the hand asked for, with the next
  // photograph carried along in front of it. The ceiling that used to live in
  // the DISTANCE is now entirely in the fact that one gesture renames the
  // plates once: the travel is a whole photograph because that is where the
  // next one is standing, and it is still exactly one photograph however hard
  // the throw was.
  function fly(d) {
    if (!cur || !beside(cur, d)) return spring();
    if (!busy) measure();
    busy = true;
    pend = d;
    ease(SW_SLIDE);
    // All the way, which takes the fade all the way with it.
    place(d > 0 ? -rFwd : rBack);
    tSlide = setTimeout(settle, SW_SLIDE);
  }

  // Not enough of a gesture. Back to centre, and no part of the throw survives.
  function spring() {
    busy = true;
    ease(SW_BACK);
    place(0);
    tSlide = setTimeout(settle, SW_BACK);
  }

  full.addEventListener("pointerdown", function (e) {
    if (e.button !== 0 || !full.classList.contains("open")) return;
    // Glass only. A trackpad's gesture is the wheel path below, and a mouse's
    // is the arrows; this is for the hand that is actually on the picture.
    if (e.pointerType === "mouse") return;
    // The three controls are targets, not surfaces. A drag that starts on one
    // of them is a shaky press on a button, not a throw.
    if (e.target.closest && e.target.closest("button")) return;
    // A swipe during a slide is allowed and cuts it short. Ignoring it instead
    // would make the second of two quick swipes read as the page having
    // stopped listening, which is exactly what the first one just proved wrong.
    if (busy) settle();
    sid = e.pointerId;
    full.setPointerCapture(sid);
    full.classList.add("swiping");
    sx0 = e.clientX; sy0 = e.clientY;
    sdx = 0; sdy = 0; smoved = 0; ate = false;
    measure();
    shist = [{ t: e.timeStamp, x: e.clientX }];
  });

  full.addEventListener("pointermove", function (e) {
    if (e.pointerId !== sid) return;
    // Against the START of the gesture and not against the last sample: the
    // plate's position is where the finger has GOT to, and summing deltas
    // there would let float error walk it off the origin over a long drag.
    sdx = e.clientX - sx0;
    sdy = e.clientY - sy0;
    smoved = Math.max(smoved, Math.abs(sdx) + Math.abs(sdy));
    place(hold(sdx));
    shist.push({ t: e.timeStamp, x: e.clientX });
    while (shist.length > 2 && e.timeStamp - shist[0].t > SW_WIN) shist.shift();
  });

  function endSwipe(e) {
    if (e.pointerId !== sid) return;
    try { full.releasePointerCapture(sid); } catch (err) {}
    sid = null;
    full.classList.remove("swiping");

    if (smoved < SW_SLOP) { place(0); return; }
    // It moved, so it was not a click -- and the click that follows a drag off
    // the plate would otherwise land on the ground and close the view.
    ate = true;

    // The last SW_WIN of it, not the last event, for the reason the wall's
    // drag gives at length: a finger slows before it lifts, and the final
    // sample alone turns a hard flick into a slow one at random.
    var a = shist[0], b = shist[shist.length - 1], dt = b.t - a.t;
    var vx = dt > 8 ? (b.x - a.x) / dt : 0;

    var d = 0;
    // Dragging left brings the next one in from the right, the way a page
    // turns, and the way the wall already pages.
    if (Math.abs(sdx) > Math.abs(sdy)) {
      if (Math.abs(sdx) >= SW_TRIP) d = sdx < 0 ? 1 : -1;
      // A short fast throw is a command too -- but only one that agrees with
      // where the finger actually went. A flick back the way it came is a
      // gesture being taken back, and taking it back is the spring below.
      else if (Math.abs(vx) >= SW_FLICK && vx * sdx > 0) d = vx < 0 ? 1 : -1;
    }

    if (d) return fly(d);
    spring();
  }

  full.addEventListener("pointerup", endSwipe);
  full.addEventListener("pointercancel", endSwipe);

  /* Two fingers on a trackpad. The deltas go straight to the wall's reader,
     which answers at most once per gesture and swallows the tail -- which is
     this half of "limit the momentum", and the half that actually needed
     limiting: a comfortable two-finger swipe measures about 650px of deltaX,
     and against a 50px trip that is thirteen photographs if nothing is
     counting. The finger path's ceiling is a distance; this one's is the
     gesture itself.

     preventDefault unconditionally, and not only when the swipe lands. Left is
     Chrome's back-navigation on a Mac, the compositor decides it before this
     listener is consulted, and a swipe that is being swallowed as a tail is
     exactly the one that would otherwise leave the page. The stylesheet's
     overscroll-behavior is already the other half of that; it is on html and
     body, so it covers this view too. */
  full.addEventListener("wheel", function (e) {
    if (!full.classList.contains("open")) return;
    e.preventDefault();
    if (!window.__sideways) return;
    var u = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? window.innerHeight : 1);
    var dx = e.deltaX * u, dy = e.deltaY * u;
    // Shift-wheel is the mouse wheel's sideways, and it is free to support:
    // the reader cannot tell where the deltaX came from.
    if (e.shiftKey && !e.deltaX) { dx = dy; dy = 0; }
    window.__sideways(dx, dy, e.timeStamp);
  }, { passive: false });

  function open(rec) {
    from = rec.el;
    // pend first: a slide cut short by opening something else owes its swap to
    // nobody, and paint() below is about to say what is on the plate anyway.
    pend = 0;
    settle();
    full.hidden = false;
    paint(rec);
    // Two frames: one for `hidden` coming off so the element has a box, one for
    // the class going on so the transition has something to run from. Setting
    // both together means no transition at all -- the element goes from not
    // being laid out to being open, and there is no first frame to interpolate.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { full.classList.add("open"); });
    });
    if (window.__pause) window.__pause(true);
    // Sideways means this photograph now, not the next category. Claiming it
    // also clears whatever the wall's last gesture left behind.
    if (window.__sidewaysTo) window.__sidewaysTo(function (dir) { fly(dir); return true; });
    full.querySelector(".shut").focus();
  }

  function close() {
    if (!full.classList.contains("open")) return;
    // Or the plate is still 160px off-centre and half transparent the next
    // time the view opens, under a transition that has outlived its gesture.
    settle();
    full.classList.remove("open");
    if (window.__pause) window.__pause(false);
    // And the wall has it back -- including, deliberately, a cleared gesture:
    // the swipe that lands as the view closes must not also page the wall.
    if (window.__sidewaysTo) window.__sidewaysTo(null);
    if (from) { from.focus(); from = null; }
    cur = null;
  }

  full.addEventListener("transitionend", function (e) {
    // Only once the fade is over, and only if it did not re-open in between.
    // Dropping the src here is what keeps a 2400px decode from sitting in
    // memory behind a wall of 125 more of them.
    //
    // e.target is checked because the plate fades too now, and its transition
    // bubbles to exactly this listener. Without the check a swipe that lands
    // in the same frame as a close tears the picture out from under the fade.
    if (e.target !== full || e.propertyName !== "opacity" ||
        full.classList.contains("open")) return;
    full.hidden = true;
    // Three of them now. Dropping the middle one and leaving its neighbours
    // resident would keep two of the largest decodes on the page alive behind
    // a wall of 125 more.
    [slot.before, slot.main, slot.after].forEach(function (el) {
      var im = el.querySelector("img");
      im.removeAttribute("src");
      im.classList.remove("in");
      el.__rec = null;
    });
  });

  full.addEventListener("click", function (e) {
    // The click a drag ends with. It is aimed at wherever the finger stopped,
    // which on a throw that started on the ground is the ground -- and the
    // ground closes the view. Cleared on the next pointerdown either way, so a
    // drag that never produces a click cannot eat the click after it.
    if (ate) { ate = false; return; }
    if (e.target.closest(".shut")) return close();
    if (e.target.closest(".prev")) return step(-1);
    if (e.target.closest(".next")) return step(1);
    // A click on the ground around the picture is a click on the way out. The
    // picture itself is not, or a mis-aimed click at an arrow closes the view.
    if (!e.target.closest(".plate")) close();
  });

  document.addEventListener("keydown", function (e) {
    if (!full.classList.contains("open")) return;
    if (e.key === "Escape") { e.preventDefault(); close(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  });

  // The world's script owns the pointer and knows when a click was a click and
  // not the end of a drag; it calls this rather than the other way round.
  window.__openFull = open;
})();
</script>
</body>
</html>
